<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DB Speed">
<meta name="application-name" content="DB Speed">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>DB Speed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one phone-width column, sticky week header, scrolling cards, fixed bottom tab bar.
   Skins are the coach's three visual options; each skin is a complete explicit palette. */
:root{
  --bg:#121315; --surface:#1b1d20; --raised:#24272b; --line:#30343a;
  --fg:#f3efe6; --muted:#9b9a93; --faint:#8e8f92;
  --accent:#d64124; --accent-ink:#fff; --accent-text:#ee6146; --blue:#5089e2; --amber:#f2b233; --good:#43c08a; --good-ink:#06150e;
  --rest:#376fcb; --rest-ink:#fff; --rest-btn:rgba(0,0,0,.18);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme:dark;
}
:root[data-skin="daylight"]{
  --bg:#eceef1; --surface:#ffffff; --raised:#f4f5f7; --line:#d9dce1;
  --fg:#15171a; --muted:#5e636b; --faint:#676c73;
  --accent:#d43b1f; --accent-ink:#fff; --accent-text:#b93216; --blue:#1f5fbf; --amber:#8c5c07; --good:#167a4d; --good-ink:#fff;
  --rest:#1f5fbf; --rest-ink:#fff; --rest-btn:rgba(0,0,0,.18);
  color-scheme:light;
}
:root[data-skin="lake"]{
  --bg:#0a1c26; --surface:#102a37; --raised:#163646; --line:#22485a;
  --fg:#e9f2f2; --muted:#93b0b6; --faint:#83a1aa;
  --accent:#f2b233; --accent-ink:#1a1405; --accent-text:#f2b233; --blue:#4fb3c8; --amber:#f2b233; --good:#5fd39a; --good-ink:#06150e;
  --rest:#4fb3c8; --rest-ink:#06181f; --rest-btn:rgba(255,255,255,.28);
  color-scheme:dark;
}
/* --accent fills buttons, --accent-text is the same hue tuned for text on this skin. Team accents arrive through --accent, so derive it. */
@supports (color:oklch(from red l c h)){
  :root{--accent-text:oklch(from var(--accent) max(l,.7) c h)}
  :root[data-skin="daylight"]{--accent-text:oklch(from var(--accent) min(l,.54) c h)}
  :root[data-skin="lake"]{--accent-text:oklch(from var(--accent) max(l,.76) c h)}
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
input.warn{border-color:var(--amber,#f2b233)!important;box-shadow:0 0 0 2px rgba(242,178,51,.35)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.teamlogo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;flex:none;margin-right:10px;box-shadow:0 0 0 1px var(--line)}
.loader .teamlogo{width:150px;height:150px;border-radius:22px;margin:0 0 8px}
.dbmark{display:block;flex:none}
.loader .dbmark{margin:0 0 8px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.brand small{display:block;font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.spacer{flex:1}
.sync{font-weight:600;color:var(--good)}
.sync[data-s="saving"]{color:var(--muted)}
.sync[data-s="offline"]{color:var(--amber)}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center}
.back{border:0;background:none;padding:6px 8px 6px 0;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}

/* type */
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:21px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
section{display:grid;gap:12px;padding-block:18px}

/* hero (scoreboard) */
.hero{padding-block:22px 18px;display:grid;gap:14px;border-bottom:1px solid var(--line)}
.hero .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.bigweek{font-family:var(--display);font-weight:800;font-size:92px;line-height:.82;letter-spacing:-.01em}
.phase{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.weekbar{display:grid;grid-template-columns:repeat(32,1fr);gap:2px}
.weekbar i{height:8px;border-radius:2px;background:var(--line)}
.weekbar i.past{opacity:.55}
.weekbar i.now{outline:2px solid var(--fg);outline-offset:1px}
.next{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.next b{color:var(--fg);font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.daycard .dn{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;width:44px;text-align:center}
.daycard .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.daycard .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daycard>div{min-width:0}
.state{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.done{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.state.part{border-color:var(--amber);color:var(--amber)}
.daycard.circuit .dn{color:var(--accent-text)}
.daycard.featured{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--fg);border:1px solid var(--line)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--raised);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* week list */
.weeks{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.wk .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.wk .l{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.wk .d{font-size:12px;color:var(--muted)}
.wk.locked{background:transparent}
.wk.locked .n,.wk.locked .l{color:var(--muted)}
.wk.current{border-color:var(--accent)}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--good)}

/* workout */
.whead{padding-block:16px 6px;display:grid;gap:6px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);transition:width .3s}
.ex{display:grid;gap:12px;padding:16px}
.ex .name{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.idx{font-family:var(--display);font-weight:800;color:var(--faint);font-size:15px;letter-spacing:.06em}
/* Exercise type tag (PUSH, PULL, LEGS, CORE, MOBILITY…): each type gets its own colour, tuned per skin. */
.idx .ty{display:inline-block;padding:1px 8px;border-radius:999px;color:var(--ty,var(--faint));background:color-mix(in srgb,var(--ty,var(--faint)) 16%,transparent);border:1px solid color-mix(in srgb,var(--ty,var(--faint)) 40%,transparent)}
:root{--t-push:#f07a5a;--t-pull:#5b9bf0;--t-legs:#f2b233;--t-core:#b38cf0;--t-mobility:#43c08a;--t-speed:#f06ea9;--t-cardio:#4fc3c8;--t-warm:#9b9a93}
:root[data-skin="daylight"]{--t-push:#b93216;--t-pull:#1f5fbf;--t-legs:#8c5c07;--t-core:#6b3fc4;--t-mobility:#167a4d;--t-speed:#b0306f;--t-cardio:#0e7c80;--t-warm:#5e636b}
:root[data-skin="lake"]{--t-push:#ff8f6b;--t-pull:#7db8ff;--t-legs:#f2b233;--t-core:#c4a3ff;--t-mobility:#5fd39a;--t-speed:#ff86bd;--t-cardio:#4fb3c8;--t-warm:#93b0b6}
.ty[data-t="push"]{--ty:var(--t-push)}.ty[data-t="pull"]{--ty:var(--t-pull)}.ty[data-t="legs"]{--ty:var(--t-legs)}.ty[data-t="core"],.ty[data-t="abs"]{--ty:var(--t-core)}
.ty[data-t="mobility"]{--ty:var(--t-mobility)}.ty[data-t="speed"]{--ty:var(--t-speed)}.ty[data-t="cardio"]{--ty:var(--t-cardio)}.ty[data-t="warm"]{--ty:var(--t-warm)}
.demo{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:7px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.demo svg{width:14px;height:14px;color:var(--accent)}
.last{font-size:13px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) 74px 62px 46px;gap:8px;align-items:center}
.set .sn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--faint);text-align:center}
.set .tg{font-size:13px;line-height:1.25;min-width:0}
.set .tg b{display:block;font-weight:600;font-size:14px}
.set .tg span{color:var(--muted)}
.set .tg em{font-style:normal;color:var(--blue);font-weight:600}
.set input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.set input::placeholder{color:var(--faint);font-weight:500}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;color:var(--faint)}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.set.done input{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.set input.rng::placeholder{font-size:13px;letter-spacing:0}
.set input.bw::placeholder{font-size:13px;letter-spacing:0}
.set.hasdrop{margin-bottom:-2px}
.set.drop .sn{font-size:16px;font-weight:600}
.set.drop .tg b{font-size:13px}
.set.drop .tg span{font-size:12px}
.set.drop input{height:40px;font-size:16px}
.colhead{display:grid;grid-template-columns:28px minmax(0,1fr) 74px 62px 46px;gap:8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
.colhead span:nth-child(2){text-align:left}
.note{width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:10px 12px;font-size:14px}
.ssflag{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--amber)}

/* circuit */
.pod{display:grid;gap:0;overflow:hidden}
.pod .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.pod .ph b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.st{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .p{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent-text)}
.st .nm{font-weight:600;line-height:1.2}
.st .nt{font-size:13px;color:var(--muted)}
.st>div{min-width:0}
.circ-desc{margin:0;color:var(--muted);line-height:1.5;max-width:65ch}
.tframe-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
.tframe{display:block;width:100%;height:clamp(440px,calc(100dvh - 230px),640px);border:0}
.timerband{display:grid;gap:10px;padding:18px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.timerband .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.timerband a{background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:12px;text-align:center;font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.rest .inner{max-width:540px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:10px}
.restbox{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--rest);color:var(--rest-ink);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.restbox .clock{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:74px}
.restbox .lbl{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;line-height:1.1}
.restbox button{border:0;border-radius:9px;padding:8px 10px;background:var(--rest-btn);color:var(--rest-ink);font-family:var(--display);font-weight:700;letter-spacing:.06em}
.restbox.over{background:var(--good);color:var(--good-ink)}
.restbox.over button{background:rgba(0,0,0,.15);color:var(--good-ink)}

/* progress view */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{padding:14px;display:grid;gap:8px}
.chart svg{width:100%;height:auto;display:block}
.ladder{display:grid;gap:4px}
.rung{display:grid;grid-template-columns:112px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.rung .bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.rung .bar i{position:absolute;inset:0 auto 0 0;background:var(--faint);border-radius:5px}
.rung.hit .bar i{background:var(--good)}
.rung.target .bar i{background:var(--amber)}
.rung .lv{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rung .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-size:14px}
.callout b{font-weight:700}
.prs{display:grid}
.pr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pr:last-child{border-bottom:0}
.pr>span:last-child{white-space:nowrap}
.pr>span:first-child{min-width:0}
.pr b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}

/* guide */
.guide p{margin:0;max-width:62ch}
.newbie summary{cursor:pointer;padding:12px 0;list-style:none}.newbie summary::-webkit-details-marker{display:none}.newbie summary::after{content:" ▾";opacity:.6}
.rule{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule h3{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.ev{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ev .dt{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ev.past{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:540px;margin:0 auto;display:grid;gap:16px;padding-block:18px}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.field input,.field select{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--raised);padding:0 12px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--raised))}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--raised);display:grid;gap:6px;text-align:left}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin .sw{height:46px;border-radius:8px;display:grid;grid-template-columns:2fr 1fr;overflow:hidden}
.skin b{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.switch{width:52px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--raised);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--faint);transition:left .2s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{left:25px;background:#fff}
.a2hs-steps{margin:0;padding-left:22px;display:grid;gap:12px;line-height:1.45}
.a2hs-steps b{color:var(--fg)}
.a2hs .x{padding:6px 10px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--amber) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));font-size:13px}
.banner button{border:0;background:none;font-weight:700;text-decoration:underline}

/* finish overlay */
.done-panel{display:grid;gap:14px;padding:22px;text-align:center}
.done-panel .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;color:var(--good)}
.done-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wtimer{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.wtimer.run{color:var(--accent-text)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.loader{min-height:80vh;display:grid;place-content:center;justify-items:center;gap:20px;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;position:relative;background:conic-gradient(var(--accent) 0 28%,var(--line) 28% 100%);animation:spin 1s cubic-bezier(.6,.2,.4,.8) infinite}
.ring i{position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation-duration:3s!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wkgoal{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.wkgoal .g{display:grid;gap:4px}
.wkgoal .g b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.wkgoal .pips{display:flex;gap:5px}
.wkgoal .pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.wkgoal .pips i.on{background:var(--good)}
.wkgoal.all{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.wkgoal.all .g b{color:var(--good)}
.wkgoal .st{display:grid;justify-items:end;gap:2px;text-align:right}
.wkgoal .st b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.wkgoal .st span{font-size:12px;color:var(--muted)}
.nowt{display:grid;place-items:center;color:var(--faint);font-size:15px}
.chip.faintchip{opacity:.75;font-weight:400}
/* finish celebration */
.done-panel{position:relative}
.done-check{width:64px;height:64px;border-radius:50%;background:var(--good);color:var(--good-ink);display:grid;place-items:center;justify-self:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1) .05s backwards}
.done-check svg{width:34px;height:34px}
.done-panel .big{animation:rise .5s ease-out .15s backwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.burst{position:absolute;left:50%;top:44px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:fly 1.3s cubic-bezier(.15,.7,.35,1) var(--d) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.lifts{display:grid;gap:8px;text-align:left}
.lift{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line);animation:rise .45s ease-out var(--d) backwards}
.lift .nm{font-weight:600;font-size:15px}
.lift .lval{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2}
.lift .sub{font-size:12px;color:var(--muted)}
.lift.pr{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--raised))}
.prchip{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:6px;background:var(--amber);color:#1a1405;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;vertical-align:2px}
.done-grid.three{grid-template-columns:repeat(3,1fr)}
/* ---------- dragon (one athlete at a time, switched on per athlete) ---------- */
.dgsvg{display:block;overflow:visible}
.dgsvg .dg-a{transform-box:fill-box}
.dg-breathe{transform-origin:50% 100%;animation:dgBreathe 3.4s ease-in-out infinite}
@keyframes dgBreathe{50%{transform:scale(1.025,.975)}}
.dg-blink{transform-origin:50% 50%;animation:dgBlink 4.6s infinite}
@keyframes dgBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.dg-tail{transform-origin:0% 70%;animation:dgTail 2.6s ease-in-out infinite alternate}
@keyframes dgTail{0%{transform:rotate(-7deg)}100%{transform:rotate(9deg)}}
.dg-wing{transform-origin:100% 85%;animation:dgWing 3s ease-in-out infinite}
@keyframes dgWing{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.dg-head{transform-origin:50% 92%;animation:dgHead 6s ease-in-out infinite}
@keyframes dgHead{0%,100%{transform:rotate(0)}30%{transform:rotate(-3.5deg)}60%{transform:rotate(2.5deg)}}
.dg-band{transform-origin:0% 50%;animation:dgBand 1.1s ease-in-out infinite alternate}
@keyframes dgBand{0%{transform:rotate(-6deg) scaleX(.96)}100%{transform:rotate(7deg) scaleX(1.04)}}
.dg-egg{transform-origin:50% 100%;animation:dgEgg 3.4s ease-in-out infinite}
@keyframes dgEgg{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(-7deg)}74%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}86%{transform:rotate(2deg)}}
.dg-shine{animation:dgShine 3.4s ease-in-out infinite;opacity:0}
@keyframes dgShine{0%,60%{opacity:0}75%{opacity:1}100%{opacity:0}}
/* moods */
.dg-happy .dg-hop{transform-origin:50% 100%;animation:dgHop 1.7s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes dgHop{0%,55%,100%{transform:none}64%{transform:scale(1.06,.92)}76%{transform:translateY(-9%) scale(.97,1.04)}88%{transform:scale(1.03,.97)}}
.dg-happy .dg-wing{animation-duration:.9s}
.dg-happy .dg-tail{animation-duration:.8s}
.dg-sleepy .dg-head{animation:dgNod 5s ease-in-out infinite}
@keyframes dgNod{0%,100%{transform:rotate(0)}40%,70%{transform:translateY(5%) rotate(6deg)}76%{transform:translateY(-2%) rotate(-2deg)}84%{transform:rotate(0)}}
.dg-sleepy .dg-blink{animation:dgSlowBlink 5s ease-in-out infinite}
@keyframes dgSlowBlink{0%,30%,85%,100%{transform:scaleY(1)}45%,72%{transform:scaleY(.35)}}
.dg-asleep .dg-breathe{animation-duration:4.8s}
.dg-asleep .dg-head,.dg-asleep .dg-wing{animation:none}
.dg-asleep .dg-tail{animation-duration:5s}
.dg-bubble{transform-box:fill-box;transform-origin:0% 50%;animation:dgBubble 4.8s ease-in-out infinite}
@keyframes dgBubble{0%,100%{transform:scale(.35)}50%{transform:scale(1)}}
.dg-z{animation:dgZ 2.8s ease-in-out infinite;opacity:0}
.dg-z.z2{animation-delay:.95s}.dg-z.z3{animation-delay:1.9s}
@keyframes dgZ{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-16px)}}
.dg-spark{transform-box:fill-box;transform-origin:50% 50%;animation:dgTwinkle 1.6s ease-in-out infinite}
.dg-spark.s2{animation-delay:.55s}.dg-spark.s3{animation-delay:1.1s}
@keyframes dgTwinkle{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
/* tap to pet */
.dg-petted .dg-hop{animation:dgPet .7s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes dgPet{0%{transform:none}30%{transform:scale(1.1,.86)}60%{transform:translateY(-14%) scale(.95,1.06)}100%{transform:none}}
.dg-hearts{position:absolute;left:50%;top:22%;width:0;height:0;pointer-events:none}
.dg-hearts i{position:absolute;font-style:normal;font-size:20px;opacity:0;animation:dgHeart 1.3s ease-out var(--d) forwards}
@keyframes dgHeart{0%{opacity:0;transform:translate(0,10px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),-70px) scale(1.1)}}
.dg-hello{animation:dgHello .8s cubic-bezier(.3,1.5,.5,1) .25s backwards}
@keyframes dgHello{0%{transform:translateY(18px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
/* home card */
.dgcard{position:relative;display:grid;gap:6px;width:100%;text-align:left;padding:8px 14px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.dgtop{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.dgtop .dgsvg{width:120px;height:120px}
.dginfo{display:grid;gap:2px}
.dgrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dgname{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.dgmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.dgmeta b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--fg)}
/* the dragon's speech bubble: cream sticker with the dragon's outline colour, in a cute rounded font */
.dg-say{position:relative;padding:10px 14px;border-radius:20px;background:#fffaf0;border:2.5px solid #7a2112;color:#3a1a10;
  font-family:var(--dgfont,"Fredoka"),ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:500;font-size:16.5px;line-height:1.3;letter-spacing:.005em;
  box-shadow:0 3px 0 rgba(122,33,18,.35);transform-origin:0% 50%;animation:dgSayIn .55s cubic-bezier(.3,1.6,.5,1) .3s backwards}
.dg-say:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;width:14px;height:14px;background:#fffaf0;border-left:2.5px solid #7a2112;border-bottom:2.5px solid #7a2112;transform:rotate(45deg);border-bottom-left-radius:3px}
.dg-say.up{transform-origin:50% 0%}
.dg-say.up:before{left:50%;top:-9px;margin:0 0 0 -8px;border:0;border-left:2.5px solid #7a2112;border-top:2.5px solid #7a2112;border-radius:3px 0 0 0}
.dg-say.down{transform-origin:30% 100%;margin-bottom:4px}
.dg-say.down:before{left:34%;top:auto;bottom:-9px;margin:0;border:0;border-right:2.5px solid #7a2112;border-bottom:2.5px solid #7a2112;border-radius:0 0 3px 0}
.dg-say.again{animation:dgSayIn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes dgSayIn{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.dg-big .dg-say{max-width:300px;font-size:18px}
.dg-big #dgPet{margin-top:-22px}
.xpbar{height:8px;border-radius:5px;background:var(--raised);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;border-radius:5px;background:var(--amber);transition:width 1.1s cubic-bezier(.2,.8,.2,1) .35s}
.dgnext{font-size:12px;color:var(--muted);margin-top:4px}
/* sheet */
.dg-big{position:relative;display:grid;justify-items:center;gap:6px;text-align:center}
.dg-big .dgsvg{width:210px;height:210px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dg-title{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.dg-path{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end}
.dg-stage{display:grid;justify-items:center;gap:2px;padding:6px 2px 8px;border-radius:12px;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.dg-stage b{color:var(--fg);font-size:12px;font-weight:600}
.dg-stage.on{background:color-mix(in srgb,var(--amber) 16%,var(--raised));outline:2px solid var(--amber)}
.dg-stage.lock .dgsvg{filter:brightness(0) invert(1);opacity:.2}
:root[data-skin="daylight"] .dg-stage.lock .dgsvg{filter:brightness(0);opacity:.22}
.dg-stats .stat span{font-size:12px;white-space:nowrap}
.dg-stage.lock b{color:var(--muted)}
.dg-stage .dgsvg{width:100%;height:auto;aspect-ratio:1}
.dg-rules{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px;line-height:1.4;color:var(--muted)}
.dg-rules b{color:var(--fg)}
.dg-prev{display:flex;flex-wrap:wrap;gap:6px}
.dg-prev button{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--raised);color:var(--fg);font-size:13px}
/* finish screen + evolution */
.dg-cele{position:relative;display:grid;place-items:center;height:200px;width:230px;margin:-4px auto 0}
.dg-cele .layer{position:absolute;inset:0;display:grid;place-items:center}
.dg-cele .dgsvg{width:200px;height:200px}
.dg-cele .new{animation:dgHello .7s cubic-bezier(.3,1.6,.5,1) .1s backwards}
.dg-cele .flash{position:absolute;left:50%;top:55%;width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6d8 35%,rgba(242,178,51,0) 70%);opacity:0;pointer-events:none}
@keyframes dgEvolveOut{0%{opacity:1;transform:none;filter:none}12%{transform:rotate(-6deg)}24%{transform:rotate(6deg)}36%{transform:rotate(-8deg) scale(1.03)}48%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-5deg) scale(1.08);filter:brightness(1.8)}74%{transform:scale(1.12);filter:brightness(6) saturate(0);opacity:1}100%{transform:scale(1.3);filter:brightness(8) saturate(0);opacity:0}}
@keyframes dgEvolveIn{0%{opacity:0;transform:scale(.35);filter:brightness(5) saturate(0)}60%{filter:brightness(1.4)}100%{opacity:1;transform:none;filter:none}}
@keyframes dgFlash{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(9)}}
.xp-pop{position:absolute;top:10px;right:0;font-family:var(--display);font-weight:800;font-size:30px;color:var(--amber);animation:xpup 1.4s ease-out .3s backwards}
@keyframes xpup{0%{opacity:0;transform:translateY(16px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:1;transform:none}}
.dg-streak{display:flex;justify-content:center;gap:14px;font-size:14px;color:var(--muted)}
.dg-streak b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--fg)}
.dg-late{animation:rise .5s ease-out 2.1s backwards}
/* egg: wiggles every few seconds, with a little hop */
.dg-egg{transform-origin:50% 100%;animation:dgEggIdle 4.4s ease-in-out infinite}
@keyframes dgEggIdle{0%,58%,100%{transform:none}62%{transform:rotate(-8deg)}66%{transform:rotate(7deg)}70%{transform:rotate(-6deg)}74%{transform:rotate(4deg)}78%{transform:none}84%{transform:translateY(-7%) scale(.97,1.03)}88%{transform:scale(1.04,.96)}92%{transform:none}}
.dg-knock .dg-egg{animation:dgShakeUp .7s ease-in-out!important}
/* hatching: cracks draw in, the egg shakes harder, the top pops off, the baby peeks out */
.dg-hatching .dg-egg{animation:dgShakeUp 1.2s ease-in forwards!important}
@keyframes dgShakeUp{0%{transform:none}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(-6deg) translateY(-1%)}40%{transform:rotate(6deg)}50%{transform:rotate(-8deg) translateY(-2%)}60%{transform:rotate(8deg)}70%{transform:rotate(-10deg) translateY(-3%)}80%{transform:rotate(10deg) scale(1.04,.96)}90%{transform:rotate(-5deg) scale(.96,1.06)}100%{transform:scale(1.06,.94)}}
.dg-crack{stroke-dasharray:240;stroke-dashoffset:240;animation:dgCrack .95s ease-out .15s forwards}
@keyframes dgCrack{to{stroke-dashoffset:0}}
.dg-cele.ev-hatch .old{animation:dgGone .01s linear 1.18s forwards}
@keyframes dgGone{to{opacity:0}}
.dg-cele .cap{opacity:0}
.dg-cele.ev-hatch .cap{animation:dgCap 1.4s cubic-bezier(.2,.7,.4,1) 1.18s forwards}
@keyframes dgCap{0%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translate(80px,-170px) rotate(260deg)}}
.dg-cele.ev-hatch .new{opacity:0;animation:dgShow .01s linear 1.18s forwards}
@keyframes dgShow{to{opacity:1}}
.dg-cele.ev-hatch .new .dg-hop{animation:dgPeek .9s cubic-bezier(.3,1.5,.5,1) 1.2s backwards,dgHop 1.7s cubic-bezier(.3,.7,.4,1) 2.2s infinite}
@keyframes dgPeek{0%{transform:translateY(34%) scale(.85,1.15)}55%{transform:translateY(-8%) scale(1.05,.95)}100%{transform:none}}
/* every other evolution: the old form shakes and glows white, a flash, the new one pops in */
.dg-cele.ev:not(.ev-hatch):not(.ev-medal) .old{opacity:0;animation:dgEvolveOut 1.5s ease-in forwards}
.dg-cele.ev:not(.ev-hatch):not(.ev-medal) .new{animation:dgEvolveIn .7s cubic-bezier(.3,1.6,.5,1) 1.3s backwards}
.dg-cele.ev .flash{animation:dgFlash 1s ease-out 1.15s}
.dg-cele.ev .xp-pop{animation-delay:2s}
.done-panel.dgp{overflow:hidden}
/* particles (confetti, bubbles, stars, hearts, shell pieces, coins) */
.dg-fx{position:absolute;left:50%;top:56%;width:0;height:0;pointer-events:none;z-index:4}
.dg-fx i{position:absolute;display:block;opacity:0;background:var(--c);animation:dgPart var(--t) cubic-bezier(.2,.65,.4,1) var(--d) forwards}
@keyframes dgPart{0%{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(0)}40%{opacity:1;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%)) scale(1) rotate(calc(var(--r) * .5))}100%{opacity:0;transform:translate(calc(var(--x) * 1.2 - 50%),calc(var(--y) + var(--g) - 50%)) scale(.9) rotate(var(--r))}}
.dg-fx .pc{width:7px;height:11px;border-radius:2px}
.dg-fx .pl{width:4px;height:18px;border-radius:2px}
.dg-fx .po{width:9px;height:9px;border-radius:50%}
.dg-fx .pb{width:10px;height:10px;border-radius:50%;background:transparent;border:2px solid var(--c)}
.dg-fx .ps{width:14px;height:14px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.dg-fx .ph{width:14px;height:13px;clip-path:polygon(50% 100%,4% 52%,0 28%,12% 6%,32% 0,50% 16%,68% 0,88% 6%,100% 28%,96% 52%)}
.dg-fx .pk{width:15px;height:12px;background:#f3efe6;border:1.5px solid #d9c8a9;clip-path:polygon(0 30%,30% 0,55% 25%,85% 5%,100% 60%,60% 100%,10% 85%)}
.dg-fx .pg{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,#f2b233 45%,#b8800f);box-shadow:0 0 0 1.5px #b8800f inset}
/* props */
.dg-prop{position:absolute;pointer-events:none;z-index:3}
.dg-balloon{left:142px;top:8px;width:60px;height:96px;transform-origin:50% 40%;opacity:0;animation:dgBalloon 1.22s ease-in forwards}
@keyframes dgBalloon{0%{opacity:0;transform:translateY(130px) scale(.5)}15%{opacity:1}55%{transform:translateY(0) scale(1) rotate(4deg)}70%{transform:scale(1.12,1.08) rotate(-4deg)}84%{transform:scale(1.25,1.2) rotate(3deg)}97%{opacity:1;transform:scale(1.42,1.36)}100%{opacity:0;transform:scale(1.6)}}
.dg-popfx{position:absolute;left:172px;top:42px;width:0;height:0;z-index:5;pointer-events:none}
.dg-popfx b{position:absolute;left:-30px;top:-14px;width:60px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;color:#f2b233;-webkit-text-stroke:1.5px #7a2112;opacity:0;animation:dgPopWord .9s cubic-bezier(.3,1.6,.5,1) 1.2s forwards}
.dg-popfx i{position:absolute;left:-2px;top:-24px;width:4px;height:14px;border-radius:2px;background:#f2b233;transform-origin:2px 24px;opacity:0;animation:dgPopLine .45s ease-out 1.2s forwards}
@keyframes dgPopWord{0%{opacity:0;transform:scale(.3) rotate(-12deg)}40%{opacity:1;transform:scale(1.15) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-14px) rotate(-8deg)}}

.shotsheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.shotlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.shotlist li{display:grid;grid-template-columns:22px minmax(0,auto) 1fr;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:14px}
.shotlist li .sn{font-family:var(--display);font-weight:800;color:var(--faint);text-align:center}
.shotlist li b{font-weight:600;white-space:nowrap}
.shotlist li .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.shotlist li.miss .num{color:var(--faint);font-style:italic}
.shotlist li.part{background:transparent}
.shotlist li.part b{color:var(--muted);font-weight:500}
.shotsess{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:14px}
.shotsess>span:first-child{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
@media (max-width:370px){.pfs.perg .pf span{font-size:10px;letter-spacing:.04em}.pf input{font-size:16px}}

/* ---------- paddling sessions (OC and PERG) ----------
   A row whose name starts with OC or PERG ("OC Main set", "OC1 Session", "PERG Main set"…) is on-water or erg work,
   not a lift. In the sheet it keeps the gym layout, read differently:
   - Each set cell F to O is one working set, up to 10 per row. The coach writes the target in the cell ("4 min",
     "1000 m", "45 s"); "6 x 4 min" in one cell also fills the 5 cells after it. A blank cell is a set the athlete can add.
     Write times as "4 min" or "45 s", not "4:00" (Sheets turns that into a clock time).

     PERG adds watts: "500 m (1:52 · 500 m · 255 W · 32 spm)". A set added by the athlete is just "(4:05 · 1060 m …)".
   - Longer text in F to O ("60-70% · Zone 2", a sentence) and column P are the coach's instructions. The athlete's own
     note is added to P after "✎ " so the instructions stay.

     "⏱ 65 min · 2026-11-11 · 12.4 km · HR 152 · RPE 7 · <Strava or Garmin link>" (the watch list reads ⏱ and the date).

/* Needs a second word ("OC Main set", "PERG Warm-up", "OC1 Session"): the plain "PERG" exercise used in gym days stays a lift. */

function pcSecs(s,target){s=String(s||"");let m;
  if(target&&(m=s.match(/^\s*(\d{1,2}):(\d{2}):00\s*$/)))return +m[1]*60+ +m[2];
  if((m=s.match(/(\d+):(\d{2}):(\d{2})/)))return +m[1]*3600+ +m[2]*60+ +m[3];
  if((m=s.match(/(\d+):(\d{2})(?!\d)/)))return +m[1]*60+ +m[2];
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:min|mins|minutes?|')(?![a-z'])/i)))return Math.round(pcNum(m[1])*60);
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:s|sec|secs|seconds?|''|")(?![a-z])/i)))return Math.round(pcNum(m[1]));
  return 0}
/* Meters: "1000 m", "500m", "1.5 km", "2k". */
function pcMeters(s){s=String(s||"");let m;
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:km|k)(?![a-z])/i)))return Math.round(pcNum(m[1])*1000);
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*m(?![a-z])/i)))return Math.round(pcNum(m[1]));

/* A short target with a time or distance ("4 min", "1000 m @ race pace") is a set; anything else is an instruction. */
const pcIsTarget=s=>{s=String(s||"").trim();return !!s&&s.length<=24&&!!(pcSecs(s,true)||pcMeters(s))};
function pcParseLog(s){const v={done:true};let t=String(s||""),m;
  if((m=t.match(/\brest\s*(\d+:\d{2}(?::\d{2})?)/i))){v.rest=pcSecs(m[1]);t=t.replace(m[0],"")}   // recovery after the set (from a screenshot)
  if((m=t.match(/(\d+:\d{2}(?::\d{2})?)/)))v.t=pcSecs(m[1]);
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*(km|m)\b/i)))v.m=Math.round(pcNum(m[1])*(/km/i.test(m[2])?1000:1));
  if((m=t.match(/(\d+)\s*W\b/)))v.w=+m[1];

function pcCellValue(target,v){const t=String(target||"").trim(),L=v&&v.done?pcLogStr(v):"";if(!L)return t;return t?`${t} (${L})`:`'(${L})`}

/* Best estimated 1RM per exercise before a given week */
/* Estimated 1RM from earlier weeks only (never from today's sets). Coach's rule for a solid working set
   (no grind): 1 rep ≈ 91% of 1RM, 2 reps ≈ 88.5%, 3 reps ≈ 86%; beyond 3 the same curve continues
   (Epley with ~2 reps in reserve: 4 ≈ 83%, 5 ≈ 81%, 6 ≈ 79%, 8 ≈ 75%, 10 ≈ 71%). Up to 12 reps. */
const PCT_BY_REPS={1:.91,2:.885,3:.86};
function e1rmRpe(w,r){w=+w;r=+r;if(!(w>0&&r>0&&r<=12))return 0;const pct=PCT_BY_REPS[r]||1/(1+(r+2)/30);return w/pct}
/* History for one exercise, as seen from week wn, day dn: every session before this one counts,
   including earlier days of the same week (an exercise done twice a week). This day itself never counts. */
function seenBefore(w,d,wn,dn){w=+w;if(w<wn)return true;if(w>wn||!dn||d===dn)return false;
  const days=WEEKS[wn-1]?.days||[];return days.findIndex(x=>x.day===d)<days.findIndex(x=>x.day===dn)}
/* Best set before this session: the actual weight × reps, plus its estimated 1RM (used for % of 1RM loads). */
function bestSet(name,wn,dn){let best=null;const k=exKey(name);
  for(const [key,v] of Object.entries(S.logs)){if(!v.done)continue;const [w,d,i]=key.split("|");if(wn&&!seenBefore(w,d,wn,dn))continue;
    const it=WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i];if(!it||exKey(it.name)!==k)continue;
    const e=e1rmRpe(+v.wt,+v.reps);if(e&&(!best||e>best.e))best={e,wt:+v.wt,reps:+v.reps}}
  return best}
function best1rm(name,wn,dn){const b=bestSet(name,wn,dn);return b?b.e:0}
/* The most recent session with this exercise: earlier days this week first (latest first), then earlier weeks. */
function lastTime(name,wn,dn){const k=exKey(name);
  for(let w=wn;w>=1;w--){const W=WEEKS[w-1];if(!W)continue;let days=W.days;
    if(w===wn){const at=days.findIndex(x=>x.day===dn);days=at<0?[]:days.slice(0,at)}
    for(const d of [...days].reverse()){let found=null;d.items.forEach((it,i)=>{if(found||exKey(it.name)!==k)return;
      const sets=(it.sets||[]).map((_,s)=>S.logs[keyOf(w,d.day,i,s)]).filter(v=>v&&v.done&&(v.wt||v.reps));
      if(sets.length)found={w,day:d.day,sets}});if(found)return found}}
  return null}
function dayStatus(w,d){const day=WEEKS[w-1].days.find(x=>x.day===d);if(S.days[`${w}|${d}`])return "done";
  if(isPaddleDay(day)){const p=`${w}|${d}|`;return Object.keys(S.pc).some(k=>k.startsWith(p)&&S.pc[k]&&S.pc[k].done)?"part":"none"}
  if(LIVE){const n=day.items.length;const hit=day.items.filter((it,i)=>(it.sets||[]).some((_,s)=>S.logs[keyOf(w,d,i,s)]?.done)).length;if(n&&hit/n>=0.5)return "done";}
  if(isCircuit(day))return "none";let any=false;day.items.forEach((it,i)=>(it.sets||[]).forEach((_,s)=>{if(S.logs[keyOf(w,d,i,s)]?.done)any=true}));return any?"part":"none"}

/* ---------- sample data (clearly marked, removable) ---------- */
function seed(){
  const base={"bench press touch & go":185,"front squat":195,"deadlift":275,"pause bench press":185};
  let rnd=7;const rand=()=>(rnd=(rnd*9301+49297)%233280)/233280;
  const hashW=(n,type)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return type==="Legs"?60+((h%12)*10):type==="Core"?"":20+((h%10)*5)};
  const plan=[[1,"Day 1"],[1,"Day 2"],[1,"Day 3"],[2,"Day 1"],[2,"Day 2"],[2,"Day 3"],[3,"Day 1"]];
  for(const [w,dn] of plan){const day=WEEKS[w-1]&&WEEKS[w-1].days.find(d=>d.day===dn);if(!day||isPaddleDay(day))continue;
    day.items.forEach((it,i)=>(it.sets||[]).forEach((s,si)=>{
      const p=pctOf(s.load);const rm=base[exKey(it.name)];let wt,reps=+repsPlaceholder(s.reps)||10;
      if(/conti/i.test(s.reps)){wt="";reps=[13,11,9][si]||8;if(w>1)reps+=1}
      else if(p&&rm){wt=r5(rm*p+(w-1)*5);reps=p>.8?(si===0?3:2):6}
      else if(s.load==="BW"){wt=""}
      else if(rm){wt=r5(rm*.62+(w-1)*5)}
      else {const hw=hashW(it.name,it.type);wt=hw===""?"":hw+(w-1)*5}
      if(/max/i.test(s.reps))reps=10+Math.round(rand()*4);
      S.logs[keyOf(w,dn,i,si)]={wt:wt===""?"":String(wt),reps:String(reps),done:true};
    }));
    S.days[`${w}|${dn}`]=Date.now();
  }
  S.seeded=true;S.sample=true;save();
}
if(!LIVE&&!S.seeded)seed();

/* Weeks in a row with every gym session done (team circuits don't count). The current week only
   adds once it's complete, so the streak never "breaks" mid-week. */
function weekStreak(){if(dragonOn())return dragonData().streak;let n=0;for(let w=CUR;w>=1;w--){const ww=WEEKS[w-1];if(!ww)continue;
  const lifts=ww.days.filter(d=>!isCircuit(d));if(!lifts.length)continue;
  const all=lifts.every(d=>dayStatus(w,d.day)==="done");if(all)n++;else if(w<CUR)break}return n}
/* "This week: 1 of 3 done" with a pip per session, and the week streak, at the top of Today. */

  const lifts=w.days.filter(d=>!isCircuit(d));if(!lifts.length)return `<div class="eyebrow">${T("thisWeek")}</div>`;
  const done=lifts.filter(d=>dayStatus(w.week,d.day)==="done").length,all=done===lifts.length,st=dragonOn()?0:weekStreak();
  return `<div class="wkgoal ${all?"all":""}"><div class="g"><div class="eyebrow">${T("thisWeek")}</div>
    <b class="num">${all?T("weekDone"):`${done} ${T("ofSets")} ${lifts.length} ${T("doneLc")}`}</b>

    ${st?`<div class="st"><b class="num">🔥 ${st}</b><span>${T("streak")}</span></div>`:""}</div>`}
function dayCard(wn,d,featured){

const CORE_LOADED=/cable|pallof|woodchop|landmine|plate|weight|med ?ball|\bdbs?\b|dumbb?ell|\bkbs?\b|kettle|barbell|carry|sandbag|backpack|machine|hyper|pull-?through|\brow\b|russian/i;
/* Pre-filled weight box, in order: bodyweight exercise → "BW 128"; a number in the sheet ("110", "+15 lb") →
   that number; a % of 1RM with a logged history → % × est. max, rounded to 5; no number or % → what was lifted
   on the same set last time; otherwise empty. (Last time used to beat the %, so a heavy single could show on a set of 5.)
   Sets done to max (Max, AMRAP, conti, or a time like 40s) never pre-fill reps: the athlete types what they got. */
const isToMax=r=>/\d+\s*(?:s|sec|secs|seconds?)\b|amrap|\bmax\b|conti/i.test(String(r||""));
function wtPick(s,p,rm,prevSet){
  const L=String(s.load||"").trim();
  if(/^BW\b/i.test(L))return "BW";
  const m=L.match(/^\+?\s*(\d+(?:\.\d+)?)\s*(?:lbs?|kg)?$/i);if(m)return m[1];
  // A range like "155-165 lb": start at the low end.
  const g=L.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*\d+(?:\.\d+)?\s*(?:lbs?|kg)?$/i);if(g)return g[1];
  if(p&&rm)return String(r5(rm*p));
  if(prevSet&&prevSet.wt)return String(prevSet.wt);
  return T("lb");
}
function repsPick(s){
  if(/conti/i.test(s.reps))return "conti";
  if(isToMax(s.reps))return "max";
  return repsRange(s.reps)||repsPlaceholder(s.reps)||"—";
}
/* Drop sets: the sheet's reps cell lists each part, "x10|x8" = 10 reps, lighter weight, 8 more right away.
   The app shows one row per part (one ✓ for the whole set) and writes "50x10 | 40x8" in the cell. */
const dropParts=r=>String(r||"").split("|").map(x=>x.trim()).filter(Boolean);
const isDrop=s=>!!s&&dropParts(s.reps).length>1;
const fmtSet=v=>`${v.wt?v.wt+"×":""}${v.reps||""}`;
function setOf(k){const [w,d,i,s]=k.split("|");return WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i]?.sets[s]}
function exCard(wn,dn,it,i){
  const last=lastTime(it.name,wn,dn);const bst=bestSet(it.name,wn,dn);const rm=bst?bst.e:0;
  const lastTxt=last?last.sets.map(v=>fmtSet(v)+(v.drops||[]).filter(d=>d&&(d.wt||d.reps)).map(d=>" ↘ "+fmtSet(d)).join("")).join(" · "):"";
  const dayItems=(WEEKS[wn-1]?.days.find(d=>d.day===dn)?.items)||[];
  const ss=/super/i.test(it.rest)&&i<dayItems.length-1; // a "superset" on the last exercise has nothing to pair with
  // Core / ab exercises get no weight box (athletes found it confusing), unless the coach prescribed a
  // load (a number or % of 1RM) or the athlete has logged a weight on this exercise before.
  // Loaded core work (carries, cable/Pallof, landmine, plates, med ball, Db/Kb…) keeps its box, and so does any
  // core exercise with something in its load cell (to force a box, type e.g. "Plate" there).
  // Mobility (stretches) is treated like unloaded core: no weight box.
  const noWt=/^(core|abs?|mobility)$/i.test(String(it.type||"").trim())&&!CORE_LOADED.test(it.name)
    &&(it.sets||[]).every(s=>!String(s.load||"").trim()||/^BW$/i.test(String(s.load).trim()))&&!bst&&!(last&&last.sets.some(v=>+v.wt));
  const rows=(it.sets||[]).map((s,si)=>{
    const v=S.logs[keyOf(wn,dn,i,si)]||{};const p=pctOf(s.load);
    const sug=p&&rm?`<em>≈ ${r5(rm*p)} ${T("lb")}</em>`:"";
    const loadTxt=s.load&&s.load!=="BW"?esc(s.load.replace(" of 1RM"," 1RM")):(s.load==="BW"?"Bodyweight":"");
    const prevSet=last?.sets[si];
    const parts=dropParts(s.reps),drop=parts.length>1,sr=drop?{...s,reps:parts[0]}:s;
    const dropRows=drop?parts.slice(1).map((part,di)=>{const dv=(v.drops||[])[di]||{},pd=(prevSet&&prevSet.drops||[])[di]||{};
      return `<div class="set drop ${v.done?"done":""}" data-k="${keyOf(wn,dn,i,si)}" data-di="${di}">
      <span class="sn" aria-hidden="true">↳</span>
      <div class="tg"><b>${esc(repsTarget(part))} ${/^[\d–+\s]+$/.test(repsTarget(part))?T("reps"):""}</b><span>${T("dropLbl")}</span></div>
      ${noWt?`<span class="nowt" aria-hidden="true">—</span>`:`<input id="dw-${wn}-${dn.slice(-1)}-${i}-${si}-${di}" inputmode="decimal" aria-label="Drop weight set ${si+1}" placeholder="${esc(pd.wt?String(pd.wt):T("lb"))}" value="${esc(dv.wt||"")}" data-f="dwt" data-di="${di}">`}
      <input id="dr-${wn}-${dn.slice(-1)}-${i}-${si}-${di}" inputmode="numeric" aria-label="Drop reps set ${si+1}" ${repsRange(part)?'class="rng"':""} placeholder="${esc(repsPick({reps:part}))}" value="${esc(dv.reps||"")}" data-f="dreps" data-di="${di}">
      <span></span></div>`}).join(""):"";
    return `<div class="set ${v.done?"done":""} ${drop?"hasdrop":""}" data-k="${keyOf(wn,dn,i,si)}" data-rest="${ss||!/super/i.test(it.rest)?restSecs(it.rest):90}">
      <span class="sn">${si+1}</span>
      <div class="tg"><b>${esc(repsTarget(sr.reps))} ${/^[\d–+\s]+$/.test(repsTarget(sr.reps))?T("reps"):""}</b><span>${loadTxt}${drop?`${loadTxt?" · ":""}${T("dropSet")}`:""}</span> ${sug}</div>
      ${noWt?`<span class="nowt" aria-hidden="true">—</span>`:`<input id="wt-${wn}-${dn.slice(-1)}-${i}-${si}" ${/^BW\b/i.test(s.load||"")?'class="bw"':""} inputmode="decimal" aria-label="Weight set ${si+1}" placeholder="${esc(wtPick(s,p,rm,prevSet))}" value="${esc(v.wt||"")}" data-f="wt">`}
      <input id="rp-${wn}-${dn.slice(-1)}-${i}-${si}" inputmode="numeric" aria-label="Reps set ${si+1}" ${repsRange(sr.reps)?'class="rng"':""} placeholder="${esc(repsPick(sr))}" value="${esc(v.reps||"")}" data-f="reps">
      <button class="chk" aria-label="Complete set ${si+1}" data-check>${I.check}</button></div>${dropRows}`}).join("");
  return `<article class="card ex">

let restT=null,restEnd=0;
function startRest(secs){
  if(S.profile.restOff)secs=0;

  const tick=()=>{const left=Math.round((restEnd-Date.now())/1000);const over=left<=0;
    box.className="restbox"+(over?" over":"");
    const a=Math.abs(left);box.innerHTML=`<span class="clock">${over?"+":""}${Math.floor(a/60)}:${String(a%60).padStart(2,"0")}</span><span class="lbl">${over?T("restOver"):T("rest")}</span><button data-add>+15s</button><button data-skip>${T("skip")}</button>`;

    if(left<-90)stopRest()};

}
function stopRest(){clearInterval(restT);document.getElementById("rest").hidden=true}

function toast(msg,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}

/* ---------- finish summary ---------- */
/* ---------- workout timer ----------
   Starts at the first ticked set, stops at "Finish workout". If nobody taps Finish, the session
   closes after an hour with no new set, and its time ends at the last ticked set. The duration is
   written to the athlete's sheet, column P of that day's "Day N" row. */
const WT_IDLE=60*60*1000;
function wtGet(w,d){S.timers=S.timers||{};const k=`${w}|${d}`,t=S.timers[k];
  if(t&&!t.end&&Date.now()-t.last>WT_IDLE){t.end=t.last;save();queueDuration(w,d)}return t}
function wtTouch(w,d){S.timers=S.timers||{};const t=wtGet(w,d),now=Date.now();
  if(!t){S.timers[`${w}|${d}`]={start:now,last:now};save();updateTimer();return}
  if(!t.end){t.last=now;save()}}
function wtFinish(w,d){const t=wtGet(w,d);if(t&&!t.end){t.end=Date.now();t.fin=true;save();queueDuration(w,d)}return t}
function wtMins(t){return t?Math.max(1,Math.round(((t.end||Date.now())-t.start)/60000)):0}
function fmtClock(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function timerHtml(w,d){const t=wtGet(w,d);
  if(!t)return `<div class="wtimer" id="wtimer">⏱ ${T("wtWait")}</div>`;
  if(t.end)return `<div class="wtimer" id="wtimer">⏱ ${wtMins(t)} min</div>`;
  return `<div class="wtimer run" id="wtimer" data-start="${t.start}">⏱ ${fmtClock(Date.now()-t.start)}</div>`}
function updateTimer(){const el=document.getElementById("wtimer");if(!el||VIEW.name!=="workout")return;el.outerHTML=timerHtml(VIEW.w,VIEW.d)}
setInterval(()=>{const el=document.getElementById("wtimer");if(el&&el.dataset.start)updateTimer()},1000);
/* The embedded circuit timer sends its explanation of the workout; show it above the timer (and remember it). */
window.addEventListener("message",e=>{const f=document.querySelector("iframe.tframe");if(!f||e.source!==f.contentWindow)return;const m=e.data;if(!m||!m.dbspeedTimer||typeof m.desc!=="string")return;
  S.circDesc=S.circDesc||{};if(m.url)S.circDesc[m.url]=m.desc.slice(0,800);save();
  const el=document.getElementById("circDesc");if(el){el.textContent=m.desc;el.hidden=false}});
/* Finished workouts are marked in the athlete's sheet (column P of the "Day N" row): "⏱ 58 min" or "✓ Done".
   The app reads these back, so sessions done and the week streak survive a new phone. */
function dayRowOf(day){if(day.row)return day.row;const rows=day.items.map(it=>it.row).filter(Boolean);return rows.length?Math.min(...rows)-2:0}
function queueDayMark(w,d,value){
  if(!LIVE)return;const W=WEEKS[w-1];const day=W&&W.days.find(x=>x.day===d);if(!day||!W.tab)return;
  const dayRow=dayRowOf(day);if(dayRow<1)return;
  S.queue[`${W.tab}|${dayRow}|16`]={tab:W.tab,row:dayRow,col:16,value,v:Date.now()};save();scheduleFlush();
}
/* "⏱ 58 min · 2026-11-01": the date the workout ended, read by the coach's nightly watch list. */
function isoDay(ms){const d=new Date(ms||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function queueDuration(w,d){const t=S.timers[`${w}|${d}`];queueDayMark(w,d,`⏱ ${wtMins(t)} min · ${isoDay(t&&t.end)}`)}
/* The best set of one exercise on one day, and the best ever logged on any other day.
   Weighted lifts compare estimated 1RM; bodyweight lifts (pull-ups, etc.) compare reps. */
function bestOnDay(wn,dn,i,it){let b=null;const bw=/^BW/i.test(String(it.sets?.[0]?.load||""));
  (it.sets||[]).forEach((_,si)=>{const v=S.logs[keyOf(wn,dn,i,si)];if(!v?.done||!(+v.reps>0))return;
    const wt=+v.wt||0,score=bw||!wt?+v.reps:e1rmRpe(wt,+v.reps);if(!score)return;
    if(!b||score>b.score)b={score,wt,reps:+v.reps,bw:bw||!wt}});return b}
function bestElsewhere(name,wn,dn,bw){const k=exKey(name);let best=null;
  for(const [key,v] of Object.entries(S.logs)){if(!v.done)continue;const [w,d,i]=key.split("|");if(+w===wn&&d===dn)continue;
    const it=WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i];if(!it||exKey(it.name)!==k)continue;
    const wt=+v.wt||0,score=bw?(wt?0:+v.reps||0):(wt?e1rmRpe(wt,+v.reps):0);
    if(score&&(!best||score>best.score))best={score,wt,reps:+v.reps,bw}}
  return best}
function liftLine(b){return b.bw?`${b.reps} ${T("reps")}`:`${b.wt}×${b.reps}`}
/* A short buzz on Android (vibration API). iPhones: iOS 18+ ticks its haptic when a switch is toggled,
   so a hidden one is toggled inside the tap; older iPhones stay silent. */
function buzz(pattern){
  try{if(navigator.vibrate&&!IS_IOS){navigator.vibrate(pattern||[70,60,140]);return}}catch(e){}
  try{const l=document.createElement("label"),i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);
    l.style.cssText="position:fixed;left:-200px;top:0;opacity:0;pointer-events:none";document.body.appendChild(l);l.click();setTimeout(()=>l.remove(),400)}catch(e){}
}
/* Our own chime, made in code (no audio file): a quick rising "pa-ping" when a workout is done, a longer
   rising sparkle when there's a PR. Media volume; off with Profile & settings → Sounds. */
let AC=null;
try{if(navigator.audioSession)navigator.audioSession.type="ambient"}catch(e){}
/* Phones only allow sound after a tap: ticking a set wakes the audio so the rest timer can ring later. */
function audioUnlock(){if(S.profile.soundOff)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.01)}catch(e){}}
function chime(kind){
  if(S.profile.soundOff)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime+.02,out=AC.createGain();out.gain.value=.22;out.connect(AC.destination);
    const note=(f,at,len,vol)=>{[["sine",1,1],["triangle",2,.18]].forEach(([type,mult,g])=>{const o=AC.createOscillator(),e=AC.createGain();
      o.type=type;o.frequency.value=f*mult;e.gain.setValueAtTime(0,t0+at);e.gain.linearRampToValueAtTime(vol*g,t0+at+.006);
      e.gain.exponentialRampToValueAtTime(.0001,t0+at+len);o.connect(e);e.connect(out);o.start(t0+at);o.stop(t0+at+len+.05)})};
    if(kind==="pr"){[[784,0],[988,.09],[1175,.18],[1568,.27],[1976,.40]].forEach(([f,at],i)=>note(f,at,i===4?.9:.35,i===4?1:.8))}
    else if(kind==="rest"){note(1047,0,.25,.9);note(1047,.32,.25,.9);note(1568,.64,.6,1)}
    else{note(880,0,.18,.7);note(1319,.085,.55,1);note(2637,.09,.35,.12)}
  }catch(e){}
}
function burstHtml(){const cs=["#e5482b","#f2b233","#f3efe6","#43c08a","#5089e2"];
  return `<div class="burst" aria-hidden="true">${Array.from({length:34},(_,i)=>{const a=-Math.PI*(.08+.84*((i*7)%34)/33),r=110+(i%5)*34;
    return `<i style="--x:${Math.round(Math.cos(a)*r*1.3)}px;--y:${Math.round(Math.sin(a)*r+140+(i%3)*30)}px;--r:${(i%2?1:-1)*(200+i*9)}deg;--c:${cs[i%5]};--d:${(i%4)*.03}s"></i>`}).join("")}</div>`}
function finishWorkout(wn,dn){
  const key=`${wn}|${dn}`;
  // Demo: the sample days are already done, so finishing one again still shows the celebration.
  if(!LIVE&&S.days[key]){delete S.days[key];if(S.timers)delete S.timers[key]}
  const fresh=!S.days[key];
  const dgBefore=fresh&&dragonOn()?dragonData():null;
  const tm=wtFinish(wn,dn);if(!tm)queueDayMark(wn,dn,"✓ Done · "+isoDay());
  const d=WEEKS[wn-1].days.find(x=>x.day===dn);let sets=0;const prs=[],lifts=[];
  d.items.forEach((it,i)=>{(it.sets||[]).forEach((_,s)=>{if(S.logs[keyOf(wn,dn,i,s)]?.done)sets++});
    const b=bestOnDay(wn,dn,i,it);if(!b)return;const prev=bestElsewhere(it.name,wn,dn,b.bw);
    const pr=!!prev&&b.score>prev.score+(b.bw?0:.5);if(pr)prs.push(it.name);
    if(lifts.length<2)lifts.push({name:it.name,b,prev,pr})});
  S.days[key]=Date.now();save();stopRest();
  let dgAfter=null;if(dgBefore){if(DPREV&&DPREV.xp!=null)DPREV.xp+=10;dgAfter=dragonData()}
  const dgEv=dgAfter&&(dgAfter.st>dgBefore.st||dgAfter.medals>dgBefore.medals);
  const fmtPrev=(l)=>l.prev?`${T("bestBefore")}: ${liftLine(l.prev)}`:T("firstTime");
  document.getElementById("overlay").innerHTML=`<div class="scrim" data-close></div><div class="sheet"><div class="inner wrap"><div class="done-panel ${dgAfter?"dgp":""}">
    ${dgAfter?(dgEv?"":burstHtml())+dragonCelebration(dgBefore,dgAfter,prs.length):`${fresh?burstHtml():""}<div class="done-check">${I.check}</div>`}
    <div class="eyebrow">${T("week")} ${WN(wn)} · ${esc(dayTitle(d))}</div><div class="big">${T("finished")}</div>
    <div class="done-grid three"><div class="stat"><b class="num">${tm?wtMins(tm):"–"}</b><span>${T("duration")} (min)</span></div><div class="stat"><b class="num">${sets}</b><span>${T("setsDone")}</span></div><div class="stat"><b class="num">${prs.length}</b><span>${T("prs")}</span></div></div>
    ${lifts.length?`<div class="lifts"><div class="eyebrow">${T("topLifts")}</div>${lifts.map((l,j)=>`<div class="lift ${l.pr?"pr":""}" style="--d:${.35+j*.12}s">
      <div class="nm">${esc(l.name)}${l.pr?`<span class="prchip">PR</span>`:""}</div><div class="lval">${liftLine(l.b)}</div>
      <div class="sub">${fmtPrev(l)}</div></div>`).join("")}</div>`:""}
    ${prs.filter(n=>!lifts.some(l=>l.name===n)).length?`<div class="callout">🏅 ${prs.filter(n=>!lifts.some(l=>l.name===n)).map(esc).join(", ")}</div>`:""}
    <button class="btn block" data-close>${T("back")}</button></div></div></div>`;
  if(dgEv){buzz([40,60,40,1050,200,80,260]);dgSfx(dgAfter.st>dgBefore.st?DG_STAGES[dgAfter.st].k:"medal")}
  else if(fresh){buzz();chime(prs.length?"pr":"done")}
  if(dgAfter)dgAnimateXp();
}

/* ---------- dragon ----------
   A pet dragon that hatches on the first finished workout and grows as the athlete trains.
   Switched on one athlete at a time: the Training App sends athlete.dragon from the Copies tab ("Dragon" column):
   "Yes", or a date like 2026-11-09 to count workouts from that week on (so it starts as an egg).
   Off for everyone else: nothing below draws unless dragonOn() is true. In the public demo it only
   appears with ?dragon in the address, so the demo used in videos stays as it is.
   It only reads which days are done (the same rule as the rest of the app); it never writes to the sheet.
   XP: 10 per finished workout, +20 each week every gym session of the week is done (the weekly goal).
   Streak = weeks in a row with the goal met. A freeze is earned every 4 goal weeks (hold up to 2);
   a short week uses one and the streak survives. The dragon never shrinks. */
let DRAGON=null,DPREV=null;
const DG_DEMO=!LIVE&&/[?&]dragon\b/i.test(location.search);
/* dragonAvail: switched on for this athlete. dragonOn: also not hidden in settings (S.profile.dgOff, this device only).
   Hidden means the app is exactly as before; XP comes from the logs, so he is still grown when shown again. */
const dragonAvail=()=>LIVE?!!DRAGON:DG_DEMO;
const dragonOn=()=>dragonAvail()&&!(S.profile&&S.profile.dgOff);
function dgSettingsRow(){if(!dragonAvail())return "";const fr=dgFr(),off=!!S.profile.dgOff;
  return `<div class="toggle dgset"><span>${fr?"Dibi, ton dragon":"Dibi, your dragon"}<small>${fr?"Il continue de grandir quand il est caché.":"He keeps growing while hidden."}</small></span><button class="switch" role="switch" id="dgSw" aria-checked="${!off}" aria-label="${fr?"Dibi, ton dragon":"Dibi, your dragon"}"></button></div>`}
function setDragon(v){v=String(v==null?"":v).trim();if(!v||/^(no|non|off|false|0)$/i.test(v)){DRAGON=null;return}
  const m=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  const nm=v.replace(/\d{4}-\d{1,2}-\d{1,2}/,"").replace(/\b(yes|oui)\b/gi,"").replace(/[^A-Za-zÀ-ÿ' -]/g," ").trim().split(/\s+/)[0]||"";
  DRAGON={from:m?new Date(+m[1],+m[2]-1,+m[3]):null,name:nm.slice(0,20)}}
/* Demo only: ?dragon&egg starts as an egg, &name=Martin sets the name the dragon says hi to. */

  const n=(DRAGON&&DRAGON.name)||(q?decodeURIComponent(q):"")||String(S.profile.name||"").split(" ")[0];return n&&n!=="Alex"?n.slice(0,20):""}
const DG_STAGES=[
  {k:"egg",xp:0,en:"Dragon egg",fr:"Œuf de dragon"},

const DG_MEDAL_XP=500;   // after Racing dragon: a medal every 500 XP, so it keeps going season after season
const dgStageOf=xp=>{let i=0;DG_STAGES.forEach((s,j)=>{if(xp>=s.xp)i=j});return i};

function dgMonday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dragonData(){
  /* XP (and so growth) counts only from the start date in the switch, so an athlete who trained before
     starts as an egg. The streak counts the whole history, the same as the app's normal streak, so nobody
     loses a streak when the dragon is switched on. Freezes are a dragon extra: earned and used only from the start date. */
  const from=DRAGON&&DRAGON.from?dgMonday(DRAGON.from):null;
  const weeks=WEEKS.filter(w=>w.week<=CUR).map(w=>{const lifts=w.days.filter(d=>!isCircuit(d));
    return {w:w.week,xpOn:!(from&&weekDate(w)<from),n:w.days.filter(d=>dayStatus(w.week,d.day)==="done").length,hit:lifts.filter(d=>dayStatus(w.week,d.day)==="done").length,goal:lifts.length,deload:/deload/i.test(phaseOf(w)||"")}});
  let workouts=0,streak=0,best=0,freezes=0,run=0,bonus=0,started=false,frozeLast=false,missedLast=false;
  weeks.forEach(x=>{if(x.xpOn)workouts+=x.n;if(!started){if(!x.n)return;started=true}
    if(!x.goal)return;   // a week with no gym sessions counts neither way
    const hit=x.hit>=x.goal;
    if(x.w===CUR){if(hit){streak++;if(x.xpOn)bonus++}}
    else if(hit){streak++;if(x.xpOn){bonus++;run++;if(run%4===0&&freezes<2)freezes++}frozeLast=false;missedLast=false}
    else if(x.xpOn&&freezes>0){freezes--;frozeLast=true;missedLast=false}
    else{streak=0;frozeLast=false;missedLast=true}
    best=Math.max(best,streak)});
  const cur=weeks.find(x=>x.w===CUR)||{n:0,hit:0,goal:0,deload:false};
  let xp=workouts*10+bonus*20;
  const dow=(TODAY.getDay()+6)%7;
  let mood=!workouts?"egg":cur.goal&&cur.hit>=cur.goal?"happy":!cur.n&&missedLast?"asleep":!cur.n&&dow>=3?"sleepy":"awake";
  if(DPREV){if(DPREV.xp!=null){xp=DPREV.xp;workouts=xp?Math.max(1,Math.round(xp/15)):0}
    if(DPREV.mood)mood=DPREV.mood;if(!xp)mood="egg";else if(mood==="egg")mood="awake"}
  const st=dgStageOf(xp),stage=DG_STAGES[st],next=DG_STAGES[st+1];
  const medals=next?0:Math.floor((xp-stage.xp)/DG_MEDAL_XP);
  const lo=next?stage.xp:stage.xp+medals*DG_MEDAL_XP,hi=next?next.xp:lo+DG_MEDAL_XP;
  const perWk=Math.max(1,cur.goal||3);
  return {xp,workouts,streak,best:Math.max(best,streak),freezes,frozeLast,mood,st,stage,next,medals,curN:cur.n,deload:cur.deload,
    pct:Math.max(0,Math.min(100,(xp-lo)/(hi-lo)*100)),toNext:hi-xp,left:Math.max(0,cur.goal-cur.hit),goal:cur.goal,
    toNextW:Math.max(1,Math.ceil((hi-xp)/(10+20/perWk)))}
}

}

function dgDay(){return Math.round((TODAY-new Date(2026,0,1))/864e5)+(DPREV&&DPREV.day||0)}
function dgPick(kind,salt,ok){let arr=(DG_LINES[kind]||DG_LINES.train||[]);if(ok)arr=arr.filter(ok);if(!arr.length)arr=DG_LINES.train||[];
  const n=arr.length;if(!n)return "";let step=37;while(n>1&&dgGcd(step,n)!==1)step+=2;
  const l=arr[(((dgDay()+(salt||0))*step)%n+n)%n];return dgFr()?l.fr:l.en}
function dgKind(d){return d.mood==="egg"?"egg":d.mood==="happy"?"weekDone":d.mood==="asleep"?"asleep":d.mood==="sleepy"?"sleepy":
  d.frozeLast&&!d.curN?"freeze":d.deload?"deload":d.left===1?"oneLeft":"train"}
function dgSay(d){
  const h=dgHoliday();
  if(h&&(h!=="xmas"||dgDay()%2===0)){const arr=DG_HOL_LINES[h];const l=arr[((dgDay()%arr.length)+arr.length)%arr.length];if(!(h==="xmas"&&d.mood==="egg"))return dgFr()?l[1]:l[0]}

}

w not what we may be.","fr":"Nous savons ce que nous sommes, mais pas ce que nous pouvons devenir.","by":"Shakespeare","byFr":"Shakespeare"},{"en":"Our doubts are traitors.","fr":"Nos doutes sont des traîtres.","by":"Shakespeare","byFr":"Shakespeare"},{"en":"Hope is the thing with feathers.","fr":"L'espoir est une chose avec des plumes.","by":"Emily Dickinson","byFr":"Emily Dickinson"},{"en":"Hope springs eternal in the human breast.","fr":"L'espoir jaillit éternellement du cœur humain.","by":"Alexander Pope","byFr":"Alexander Pope"},{"en":"I'm not afraid of storms, for I'm learning how to sail my ship.","fr":"Je n'ai pas peur des tempêtes : j'apprends à mener mon bateau.","by":"Louisa May Alcott","byFr":"Louisa May Alcott"},{"en":"Isn't it nice to think that tomorrow is a new day with no mistakes in it yet?","fr":"C'est bon de penser que demain est un jour neuf, sans aucune erreur encore.","by":"L. M. Montgomery","byFr":"L. M. Montgomery"},{"en":"Looking forward to things is half the pleasure of them.","fr":"Attendre les choses avec impatience, c'est la moitié du plaisir.","by":"L. M. Montgomery","byFr":"L. M. Montgomery"},{"en":"There is nothing half so much worth doing as simply messing about in boats.","fr":"Rien ne vaut la peine autant que de simplement s'amuser en bateau.","by":"Kenneth Grahame","byFr":"Kenneth Grahame"},{"en":"I've believed as many as six impossible things before breakfast.","fr":"J'ai déjà cru jusqu'à six choses impossibles avant le déjeuner.","by":"Lewis Carroll","byFr":"Lewis Carroll"},{"en":"Begin at the beginning, and go on till you come to the end: then stop.","fr":"Commence au commencement, continue jusqu'à la fin, puis arrête-toi.","by":"Lewis Carroll","byFr":"Lewis Carroll"},{"en":"It's no use going back to yesterday, because I was a different person then.","fr":"Inutile de revenir à hier : j'étais quelqu'un d'autre.","by":"Lewis Carroll","byFr":"Lewis Carroll"},{"en":"Every day, in every way, I'm getting better and better.","fr":"To const DG_STOICS=/^(Marcus Aurelius|Seneca|Epictetus)$/;
function dgQuote(){const n=DG_QUOTES.length;if(!n)return null;let step=41;while(n>1&&dgGcd(step,n)!==1)step+=2;
  let q=DG_QUOTES[((dgDay()*step)%n+n)%n];
  if(DPREV&&DPREV.stoic){const st=DG_QUOTES.filter(x=>DG_STOICS.test(x.by));if(st.length)q=st[((dgDay()%st.length)+st.length)%st.length]}
  return {t:dgFr()?q.fr:q.en,by:dgFr()?(q.byFr||q.by):q.by,stoic:DG_STOICS.test(q.by)}}
/* A Stoic day: the dragons wear a laurel wreath, keep a calm face, float like they're meditating, and drop laurel leaves when tapped. */
function dgStoicNow(){const h=dgHoliday();if(h&&(h!=="xmas"||dgDay()%2===0))return false;const q=dgQuote();return !!(q&&q.stoic)}
function dgWreath(cx,cy,rx,ry,sz,side){const L="#5fa04e",LD="#2f6b2a";let h="";
  [22,38,54,70].forEach(t=>[t,180-t].forEach(th=>{const a=th*Math.PI/180,x=cx+rx*Math.cos(a),y=cy-ry*Math.sin(a);
    h+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(7*sz).toFixed(1)}" ry="${(3.4*sz).toFixed(1)}" fill="${L}" stroke="${LD}" stroke-width="${(1.2*sz).toFixed(1)}" transform="rotate(${(90-th+(th>90?-22:22)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`}));
  return `<g class="dg-wreath">${h}<circle cx="${cx-rx*.18}" cy="${cy-ry*1.02}" r="${2.2*sz}" fill="#f2b233"/><circle cx="${cx+rx*.18}" cy="${cy-ry*1.02}" r="${2.2*sz}" fill="#f2b233"/></g>`}
function dgSayHtml(d){
  const h=dgHoliday();
  if(h&&(h!=="xmas"||dgDay()%2===0))return esc(dgSay(d));
  const q=dgQuote();if(!q)return esc(dgSay(d));
  return `${esc(q.t)}<span class="dg-by">${esc(q.by)}</span>`;
}

/* A barbell with red plates, drawn in the dragon's own (scaled) coordinates so it always spans the picture. */
function dgBarbell(s){const {OL,R,AM,AMD}=DGC,y=176,L=100-95/s,Rr=100+95/s,k=1/s;
  const plate=(x,dir)=>`<rect x="${x-6*k}" y="${y-22*k}" width="${12*k}" height="${44*k}" rx="${4*k}" fill="${R}" stroke="${OL}" stroke-width="${2.5*k}"/><rect x="${x+dir*9*k-4.5*k}" y="${y-15*k}" width="${9*k}" height="${30*k}" rx="${3*k}" fill="${AM}" stroke="${AMD}" stroke-width="${2*k}"/><rect x="${x+dir*17*k-3*k}" y="${y-6*k}" width="${6*k}" height="${12*k}" rx="${1.5*k}" fill="#9aa3ad" stroke="#4b525a" stroke-width="${1.5*k}"/>`;
  return `<g><rect x="${L}" y="${y-3.5*k}" width="${Rr-L}" height="${7*k}" rx="${3.5*k}" fill="#b9c1ca" stroke="#4b525a" stroke-width="${2*k}"/>${plate(L+14*k,1)}${plate(Rr-14*k,-1)}</g>`}
function dragonSVG(st,mood,o){
  o=o||{};const px=o.px||110;
  const h=o.hol===undefined?(o.still?"":dgHoliday()):o.hol;
  if(!st)return dgEggSVG(Object.assign({},o,{hol:h}));
  const g=DG_STAGES[st];const {C,R,EGG}=DGC;
  const top=190-(190-(124-71*g.head))*g.s+(g.dy||0),rx=100+41*g.head*g.s,lx=100-41*g.head*g.s;
  const zz=(mood==="asleep"||mood==="sleepy")&&!o.still?`<g fill="#9b9a93" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800"><text class="dg-z" x="${(rx-2).toFixed(0)}" y="${(top+18).toFixed(0)}" font-size="20">z</text><text class="dg-z z2" x="${(rx+12).toFixed(0)}" y="${(top+2).toFixed(0)}" font-size="27">z</text>${mood==="asleep"?`<text class="dg-z z3" x="${(rx+26).toFixed(0)}" y="${(top-16).toFixed(0)}" font-size="34">Z</text>`:""}</g>`:"";
  const star=(x,y,c,cls)=>`<path class="dg-spark ${cls}" d="M${x} ${y-9} l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="${c}"/>`;
  const sparks=(mood==="happy"||h==="eve")&&!o.still&&h!=="remember"?star(rx+12,top+12,"#f2b233","")+star(lx-12,top+30,"#f2b233","s2")+star(rx+4,top+60,"#fff6d8","s3"):"";
  const hatchShell=g.k==="hatch"?`<path d="${DG_CRACK} A48 60 0 1 1 52.7 118 Z" fill="${C}" stroke="${EGG}" stroke-width="3" stroke-linejoin="round"/>
     <path d="M55 140 Q100 126 145 140 M57 155 Q100 141 143 155 M62 169 Q100 156 138 169" fill="none" stroke="${R}" stroke-width="5" stroke-linecap="round"/>
     <ellipse cx="79" cy="115" rx="9" ry="6.5" fill="${DGC.RD}" stroke="${DGC.OL}" stroke-width="2.5"/><ellipse class="dg-pawr" cx="121" cy="115" rx="9" ry="6.5" fill="${DGC.RD}" stroke="${DGC.OL}" stroke-width="2.5"/>${h==="remember"?dgPoppy(140,132,.6):""}`:"";
  // Dec 25: hands a gift to a mini dragon, and the gift pops open
  let main=dgBody(g,mood,Object.assign({},o,{hol:h})),extra="";
  if(h==="day"&&st>=2&&!o.still){
    const mini=dgBody(Object.assign({},DG_STAGES[2],{s:.4,head:1.3,dy:0}),"happy",{hol:"xmas",mini:true});
    main=`<g transform="translate(-24 0) translate(100 190) scale(.9) translate(-100 -190)">${main}</g>`;
    extra=`<g transform="translate(66 2)">${mini}</g>
      <g transform="translate(122 150)"><rect x="0" y="8" width="30" height="24" rx="3" fill="#43c08a" stroke="${DGC.OL}" stroke-width="2.5"/><rect x="12" y="8" width="6" height="24" fill="#f2b233"/>
      <g class="dg-a dg-lid"><rect x="-3" y="0" width="36" height="10" rx="3" fill="#43c08a" stroke="${DGC.OL}" stroke-width="2.5"/><rect x="12" y="0" width="6" height="10" fill="#f2b233"/><path d="M15 0 C6 -10 2 -2 15 0 C28 -2 24 -10 15 0" fill="#f2b233" stroke="${DGC.AMD}" stroke-width="2"/></g>
      <g class="dg-gspark">${star(15,-14,"#f2b233","")}${star(0,-26,"#fff6d8","s2")}${star(30,-24,"#f2b233","s3")}<text x="15" y="-36" text-anchor="middle" font-size="14">❤️</text></g></g>`;
  }
  const perchBar=o.perch&&g.k==="hatch"?dgBarbell(1).replace('<g>','<g transform="translate(0 6)">'):"";
  return `<svg class="dgsvg dg-${mood} ${h?"dg-h-"+h:""} ${o.cls||""}" width="${px}" height="${px}" viewBox="0 0 200 200" role="img" aria-label="${esc(dgName(st))}">
    <ellipse cx="${h==="day"&&st>=2&&!o.still?88:100}" cy="191" rx="${(48*g.s).toFixed(1)}" ry="6" fill="#000" opacity=".18"/>
    ${main}${hatchShell}${perchBar}${extra}${sparks}${zz}</svg>`;
}

function dragonGym(day){

  return `<div class="dg-gym dg-gym-${k}" aria-hidden="true"><svg viewBox="0 0 260 100"><path d="M-10 97.5 H270" stroke="var(--line)" stroke-width="3"/>

}

    app.querySelectorAll(`.set.drop[data-k="${k}"]`).forEach(dr=>{const di=+dr.dataset.di,dw=dr.querySelector('[data-f="dwt"]'),drp=dr.querySelector('[data-f="dreps"]');

      v.drops=v.drops||[];if(w||typed){v.drops[di]={wt:w,reps:r};if(dw)dw.value=w;if(drp)drp.value=r}else v.drops[di]={wt:"",reps:""}});
