<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DB Speed">
<meta name="application-name" content="DB Speed">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>DB Speed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one phone-width column, sticky week header, scrolling cards, fixed bottom tab bar.
   Skins are the coach's three visual options; each skin is a complete explicit palette. */
:root{
  --bg:#121315; --surface:#1b1d20; --raised:#24272b; --line:#30343a;
  --fg:#f3efe6; --muted:#9b9a93; --faint:#64666b;
  --accent:#e5482b; --accent-ink:#fff; --blue:#3d7bd9; --amber:#f2b233; --good:#43c08a;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme:dark;
}
:root[data-skin="daylight"]{
  --bg:#eceef1; --surface:#ffffff; --raised:#f4f5f7; --line:#d9dce1;
  --fg:#15171a; --muted:#5e636b; --faint:#9aa0a8;
  --accent:#d43b1f; --accent-ink:#fff; --blue:#1f5fbf; --amber:#b7790a; --good:#1c8c5a;
  color-scheme:light;
}
:root[data-skin="lake"]{
  --bg:#0a1c26; --surface:#102a37; --raised:#163646; --line:#22485a;
  --fg:#e9f2f2; --muted:#93b0b6; --faint:#5d7c85;
  --accent:#f2b233; --accent-ink:#1a1405; --blue:#4fb3c8; --amber:#f2b233; --good:#5fd39a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
input.warn{border-color:var(--amber,#f2b233)!important;box-shadow:0 0 0 2px rgba(242,178,51,.35)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.teamlogo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;flex:none;margin-right:10px;box-shadow:0 0 0 1px var(--line)}
.loader .teamlogo{width:150px;height:150px;border-radius:22px;margin:0 0 8px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.brand small{display:block;font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.spacer{flex:1}
.sync{font-weight:600;color:var(--good)}
.sync[data-s="saving"]{color:var(--muted)}
.sync[data-s="offline"]{color:var(--amber)}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center}
.back{border:0;background:none;padding:6px 8px 6px 0;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}

/* type */
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:21px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
section{display:grid;gap:12px;padding-block:18px}

/* hero (scoreboard) */
.hero{padding-block:22px 18px;display:grid;gap:14px;border-bottom:1px solid var(--line)}
.hero .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.bigweek{font-family:var(--display);font-weight:800;font-size:92px;line-height:.82;letter-spacing:-.01em}
.phase{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.weekbar{display:grid;grid-template-columns:repeat(32,1fr);gap:2px}
.weekbar i{height:8px;border-radius:2px;background:var(--line)}
.weekbar i.past{opacity:.55}
.weekbar i.now{outline:2px solid var(--fg);outline-offset:1px}
.next{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.next b{color:var(--fg);font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.daycard .dn{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;width:44px;text-align:center}
.daycard .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.daycard .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daycard>div{min-width:0}
.state{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.done{background:var(--good);border-color:var(--good);color:#06150e}
.state.part{border-color:var(--amber);color:var(--amber)}
.daycard.circuit .dn{color:var(--accent)}
.daycard.featured{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--fg);border:1px solid var(--line)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--raised);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* week list */
.weeks{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.wk .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.wk .l{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.wk .d{font-size:12px;color:var(--muted)}
.wk.locked{opacity:.45}
.wk.current{border-color:var(--accent)}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--good)}

/* workout */
.whead{padding-block:16px 6px;display:grid;gap:6px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);transition:width .3s}
.ex{display:grid;gap:12px;padding:16px}
.ex .name{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.idx{font-family:var(--display);font-weight:800;color:var(--faint);font-size:15px;letter-spacing:.06em}
.demo{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:7px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.demo svg{width:14px;height:14px;color:var(--accent)}
.last{font-size:13px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) 74px 62px 46px;gap:8px;align-items:center}
.set .sn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--faint);text-align:center}
.set .tg{font-size:13px;line-height:1.25;min-width:0}
.set .tg b{display:block;font-weight:600;font-size:14px}
.set .tg span{color:var(--muted)}
.set .tg em{font-style:normal;color:var(--blue);font-weight:600}
.set input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.set input::placeholder{color:var(--faint);font-weight:500}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;color:var(--faint)}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--good);border-color:var(--good);color:#06150e}
.set.done input{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.set input.rng::placeholder{font-size:13px;letter-spacing:0}
.set input.bw::placeholder{font-size:13px;letter-spacing:0}
.colhead{display:grid;grid-template-columns:28px minmax(0,1fr) 74px 62px 46px;gap:8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
.colhead span:nth-child(2){text-align:left}
.note{width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:10px 12px;font-size:14px}
.ssflag{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--amber)}

/* circuit */
.pod{display:grid;gap:0;overflow:hidden}
.pod .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.pod .ph b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.st{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .p{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent)}
.st .nm{font-weight:600;line-height:1.2}
.st .nt{font-size:13px;color:var(--muted)}
.st>div{min-width:0}
.circ-desc{margin:0;color:var(--muted);line-height:1.5;max-width:65ch}
.tframe-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
.tframe{display:block;width:100%;height:clamp(440px,calc(100dvh - 230px),640px);border:0}
.timerband{display:grid;gap:10px;padding:18px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.timerband .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.timerband a{background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:12px;text-align:center;font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.rest .inner{max-width:540px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:10px}
.restbox{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.restbox .clock{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:74px}
.restbox .lbl{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;line-height:1.1}
.restbox button{border:0;border-radius:9px;padding:8px 10px;background:rgba(255,255,255,.18);color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.06em}
.restbox.over{background:var(--good);color:#06150e}
.restbox.over button{background:rgba(0,0,0,.15);color:#06150e}

/* progress view */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{padding:14px;display:grid;gap:8px}
.chart svg{width:100%;height:auto;display:block}
.ladder{display:grid;gap:4px}
.rung{display:grid;grid-template-columns:112px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.rung .bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.rung .bar i{position:absolute;inset:0 auto 0 0;background:var(--faint);border-radius:5px}
.rung.hit .bar i{background:var(--good)}
.rung.target .bar i{background:var(--amber)}
.rung .lv{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rung .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-size:14px}
.callout b{font-weight:700}
.prs{display:grid}
.pr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pr:last-child{border-bottom:0}
.pr>span:last-child{white-space:nowrap}
.pr>span:first-child{min-width:0}
.pr b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}

/* guide */
.guide p{margin:0;max-width:62ch}
.newbie summary{cursor:pointer;padding:12px 0;list-style:none}.newbie summary::-webkit-details-marker{display:none}.newbie summary::after{content:" ▾";opacity:.6}
.rule{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule h3{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.ev{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ev .dt{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ev.past{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:540px;margin:0 auto;display:grid;gap:16px;padding-block:18px}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.field input,.field select{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--raised);padding:0 12px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--raised))}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--raised);display:grid;gap:6px;text-align:left}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin .sw{height:46px;border-radius:8px;display:grid;grid-template-columns:2fr 1fr;overflow:hidden}
.skin b{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.switch{width:52px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--raised);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--faint);transition:left .2s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{left:25px;background:#fff}
.a2hs-steps{margin:0;padding-left:22px;display:grid;gap:12px;line-height:1.45}
.a2hs-steps b{color:var(--fg)}
.a2hs .x{padding:6px 10px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--amber) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));font-size:13px}
.banner button{border:0;background:none;font-weight:700;text-decoration:underline}

/* finish overlay */
.done-panel{display:grid;gap:14px;padding:22px;text-align:center}
.done-panel .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;color:var(--good)}
.done-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wtimer{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.wtimer.run{color:var(--accent,var(--fg))}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.loader{min-height:80vh;display:grid;place-content:center;justify-items:center;gap:20px;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;position:relative;background:conic-gradient(var(--accent) 0 28%,var(--line) 28% 100%);animation:spin 1s cubic-bezier(.6,.2,.4,.8) infinite}
.ring i{position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation-duration:3s!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){.set,.colhead{grid-template-columns:22px minmax(0,1fr) 64px 54px 42px;gap:6px}.bigweek{font-size:76px}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Main"><div class="inner" id="tabs"></div></nav>
<div class="rest" id="rest" hidden><div class="inner"><div class="restbox" id="restbox"></div></div></div>

function restSecs(r){r=String(r||"").trim();if(/super/i.test(r))return 0;const m=r.match(/^(\d+)(?:\s*-\s*(\d+))?\s*\+?\s*(?:min)?$/i);if(!m)return 90;return +(m[2]||m[1])*60}

function cellKeyOf(k){const [w,d,i,s]=k.split("|");const W=WEEKS[w-1];const it=W&&W.days.find(x=>x.day===d)?.items[i];const st=it&&it.sets[s];return st&&W.tab?`${W.tab}|${it.row}|${st.col}`:null}

/* Best estimated 1RM per exercise before a given week */
/* Estimated 1RM from earlier weeks only (never from today's sets). Coach's rule for a solid working set
   (no grind): 1 rep ≈ 91% of 1RM, 2 reps ≈ 88.5%, 3 reps ≈ 86%; beyond 3 the same curve continues
   (Epley with ~2 reps in reserve: 4 ≈ 83%, 5 ≈ 81%, 6 ≈ 79%, 8 ≈ 75%, 10 ≈ 71%). Up to 12 reps. */
const PCT_BY_REPS={1:.91,2:.885,3:.86};
function e1rmRpe(w,r){w=+w;r=+r;if(!(w>0&&r>0&&r<=12))return 0;const pct=PCT_BY_REPS[r]||1/(1+(r+2)/30);return w/pct}
function best1rm(name,beforeWeek){let best=0;const k=exKey(name);
  for(const [key,v] of Object.entries(S.logs)){if(!v.done)continue;const [w,d,i]=key.split("|");if(beforeWeek&&+w>=beforeWeek)continue;
    const it=WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i];if(!it||exKey(it.name)!==k)continue;best=Math.max(best,e1rmRpe(+v.wt,+v.reps,it.rpe))}
  return best}
function lastTime(name,beforeWeek){const k=exKey(name);let found=null;
  for(let w=beforeWeek-1;w>=1&&!found;w--){for(const d of WEEKS[w-1].days){d.items.forEach((it,i)=>{if(found||exKey(it.name)!==k)return;
    const sets=(it.sets||[]).map((_,s)=>S.logs[keyOf(w,d.day,i,s)]).filter(v=>v&&v.done&&(v.wt||v.reps));
    if(sets.length)found={w,sets}})}}
  return found}
function dayStatus(w,d){const day=WEEKS[w-1].days.find(x=>x.day===d);if(S.days[`${w}|${d}`])return "done";
  if(LIVE){const n=day.items.length;const hit=day.items.filter((it,i)=>(it.sets||[]).some((_,s)=>S.logs[keyOf(w,d,i,s)]?.done)).length;if(n&&hit/n>=0.5)return "done";}
  if(isCircuit(day))return "none";let any=false;day.items.forEach((it,i)=>(it.sets||[]).forEach((_,s)=>{if(S.logs[keyOf(w,d,i,s)]?.done)any=true}));return any?"part":"none"}

function seed(){
  const base={"bench press touch & go":185,"front squat":195,"deadlift":275,"pause bench press":185};
  let rnd=7;const rand=()=>(rnd=(rnd*9301+49297)%233280)/233280;
  const hashW=(n,type)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return type==="Legs"?60+((h%12)*10):type==="Core"?"":20+((h%10)*5)};
  const plan=[[1,"Day 1"],[1,"Day 2"],[1,"Day 3"],[2,"Day 1"],[2,"Day 2"],[2,"Day 3"],[3,"Day 1"]];
  for(const [w,dn] of plan){const day=WEEKS[w-1]&&WEEKS[w-1].days.find(d=>d.day===dn);if(!day)continue;
    day.items.forEach((it,i)=>(it.sets||[]).forEach((s,si)=>{
      const p=pctOf(s.load);const rm=base[exKey(it.name)];let wt,reps=+repsPlaceholder(s.reps)||10;
      if(/conti/i.test(s.reps)){wt="";reps=[13,11,9][si]||8;if(w>1)reps+=1}
      else if(p&&rm){wt=r5(rm*p+(w-1)*5);reps=p>.8?(si===0?3:2):6}
      else if(s.load==="BW"){wt=""}
      else if(rm){wt=r5(rm*.62+(w-1)*5)}
      else {const hw=hashW(it.name,it.type);wt=hw===""?"":hw+(w-1)*5}
      if(/max/i.test(s.reps))reps=10+Math.round(rand()*4);
      S.logs[keyOf(w,dn,i,si)]={wt:wt===""?"":String(wt),reps:String(reps),done:true};
    }));
    S.days[`${w}|${dn}`]=Date.now();
  }
  S.seeded=true;S.sample=true;save();
}

  return topbar(`${BRAND?`<img class="teamlogo" src="${BRAND.logo}" alt="">`:""}<div class="brand">${LIVE?esc(TEAM.name)+"'s Program":TEAM.name+" Gym"}<small>${LIVE?'<span id="sync" class="sync">Synced with your sheet</span>':TEAM.season}</small></div><div class="spacer"></div><button class="avatar" id="openSettings" aria-label="${T("settings")}">${esc(ini)}</button>`)}

/* ---------- TODAY ---------- */
/* ---------- add to home screen ----------
   iPhone/iPad: Safari can't be triggered by a page, so we show the exact steps. Android: Chrome's
   own prompt if it offers one, otherwise the steps (⋮ → Add to Home screen). Hidden once opened
   from the home screen. The shortcut keeps the athlete's private link (current URL). */
const UA=navigator.userAgent||"";
const IS_IOS=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
const STANDALONE=(()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}})();
let installEvt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
function a2hsBanner(){if(STANDALONE||!LIVE||S.a2hsHide||!(IS_IOS||IS_ANDROID))return "";
  return `<div style="padding-top:12px"><div class="banner a2hs"><span>📲 ${T("a2hsBanner")}</span><span style="display:flex;gap:6px;flex:none"><button id="a2hsHow">${T("a2hsHow")}</button><button id="a2hsX" class="x" aria-label="Dismiss">✕</button></span></div></div>`}
function openA2hs(){
  if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();return}
  const fr=S.profile.lang==="fr";let steps;
  // Opened inside another app (Messenger, Instagram, Gmail, Discord…): those browsers can't add to the home screen.
  const inApp=/FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\/|Snapchat|TikTok|musical_ly|GSA\/|Discord/i.test(UA);
  const appName=/GSA\//.test(UA)?(fr?"l\u2019app Google":"the Google app"):/Instagram/i.test(UA)?"Instagram":/Messenger|FBAN\/Messenger/i.test(UA)?"Messenger":/FBAN|FBAV|FB_IAB/i.test(UA)?"Facebook":/Snapchat/i.test(UA)?"Snapchat":/TikTok|musical_ly/i.test(UA)?"TikTok":/Discord/i.test(UA)?"Discord":(fr?"une autre app":"another app");
  const browser=IS_IOS?"Safari":"Chrome";
  if(IS_IOS){const otherBrowser=/CriOS|FxiOS|EdgiOS/.test(UA);
    steps=fr?[otherBrowser?"Touche le bouton <b>Partager</b> (carré avec une flèche ⬆) dans la barre d\u2019adresse.":"Touche le bouton <b>Partager</b> (carré avec une flèche ⬆) en bas de l\u2019écran (en haut à droite sur iPad).","Fais défiler et touche <b>« Sur l\u2019écran d\u2019accueil »</b>.","Touche <b>« Ajouter »</b>."]
      :[otherBrowser?"Tap the <b>Share</b> button (square with an arrow ⬆) in the address bar.":"Tap the <b>Share</b> button (square with an arrow ⬆) at the bottom of the screen (top right on iPad).","Scroll down and tap <b>“Add to Home Screen”</b>.","Tap <b>“Add”</b>."]}
  else if(IS_ANDROID&&/SamsungBrowser/i.test(UA)){steps=fr?["Touche le menu <b>≡</b> en bas à droite.","Touche <b>« Ajouter la page à »</b>, puis <b>« Écran d\u2019accueil »</b>.","Touche <b>« Ajouter »</b>."]
      :["Tap the <b>≡</b> menu at the bottom right.","Tap <b>“Add page to”</b>, then <b>“Home screen”</b>.","Tap <b>“Add”</b>."]}
  else if(IS_ANDROID){steps=fr?["Touche le menu <b>⋮</b> en haut à droite du navigateur.","Touche <b>« Ajouter à l\u2019écran d\u2019accueil »</b> (ou « Installer l\u2019application »).","Touche <b>« Ajouter »</b>."]
      :["Tap the <b>⋮</b> menu at the top right of your browser.","Tap <b>“Add to Home screen”</b> (or “Install app”).","Tap <b>“Add”</b>."]}
  else steps=fr?["Ajoute cette page à tes favoris : c\u2019est ton lien personnel."]:["Bookmark this page: it\u2019s your private link."];
  if(inApp&&(IS_IOS||IS_ANDROID))steps.unshift(fr?`Tu as ouvert ce lien dans <b>${appName}</b>, qui ne peut pas l\u2019ajouter à l\u2019écran d\u2019accueil. Touche <b>⋯</b> (ou Partager) et choisis <b>« Ouvrir dans ${browser} »</b>. Pas d\u2019option? Choisis <b>« Copier le lien »</b> et colle-le dans ${browser}.`:`You opened this link in <b>${appName}</b>, which can't add it to your home screen. Tap <b>⋯</b> (or Share) and choose <b>“Open in ${browser}”</b>. No such option? Choose <b>“Copy link”</b> and paste it into ${browser}.`);
  document.getElementById("overlay").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="${T("a2hsTitle")}"><div class="inner wrap">
    <h2>${T("a2hsTitle")}</h2><ol class="a2hs-steps">${steps.map(x=>`<li>${x}</li>`).join("")}</ol>
    <p class="muted small" style="margin:0">${T("a2hsNote")} ${fr?"Si tu ne vois pas « Sur l\u2019écran d\u2019accueil », ouvre d\u2019abord le lien dans "+(IS_ANDROID?"Chrome":"Safari ou Chrome")+" (pas dans l\u2019app Google, Gmail, Messenger ou Discord).":"Don\u2019t see “Add to Home Screen”? Open your link in "+(IS_ANDROID?"Chrome":"Safari or Chrome")+" first (not inside the Google app, Gmail, Messenger or Discord)."}</p>
    <button class="btn block" id="a2hsGot">${T("a2hsDone")}</button></div></div>`;
}

function dayCard(wn,d,featured){
  const st=dayStatus(wn,d.day);const c=isCircuit(d);
  const sub=c?(d.summary||""):`${d.items[0].name} + ${d.items.length-1} more`;
  const label=st==="done"?T("done"):st==="part"?T("resume"):featured?T("start"):T("notStarted");
  return `<button class="daycard ${c?"circuit":""} ${featured&&st!=="done"?"featured":""}" data-open="${wn}|${d.day}">
    <span class="dn">${c?"C":d.day.slice(-1)}</span>
    <div><div class="t">${esc(dayTitle(d))}</div><div class="s">${esc(sub)}</div></div>
    <span class="state ${st==="done"?"done":st==="part"?"part":""}">${label}</span></button>`;
}

function futureWeeks(){
  if(!LIVE||!SEASON)return [];
  const dates=WEEKS.map(w=>weekDate(w).getTime()).filter(x=>!isNaN(x));const last=dates.length?Math.max(...dates):-Infinity;
  return SEASON.weeks.filter(sw=>sw.start.getTime()>last+3*864e5&&!WEEKS.some(w=>String(w.name)===String(sw.n)));
}

function viewWorkout(wn,dn){
  const w=WEEKS[wn-1];const d=w.days.find(x=>x.day===dn);
  const head=topbar(`<button class="back" id="backWeek" data-week="${wn}">‹ ${T("week")} ${WN(wn)}</button><div class="spacer"></div><span class="eyebrow">${esc(dn)}</span>`);
  if(isCircuit(d))return head+viewCircuit(w,d);
  let total=0,done=0;d.items.forEach((it,i)=>(it.sets||[]).forEach((_,s)=>{total++;if(S.logs[keyOf(wn,dn,i,s)]?.done)done++}));
  const pct=total?Math.round(done/total*100):0;
  return head+`<div class="wrap">
   <div class="whead"><div class="eyebrow">${T("week")} ${WN(wn)}${phaseOf(w)?" · "+esc(phaseOf(w)):""}</div><h1>${esc(dayTitle(d))}</h1>
     <div class="small muted num" id="setCount">${done} ${T("ofSets")} ${total} ${T("sets")}</div>
     ${timerHtml(wn,dn)}
     <div class="progress"><i id="pbar" style="width:${pct}%"></i></div></div>
   <section>${d.items.map((it,i)=>exCard(wn,dn,it,i)).join("")}
     <button class="btn block" id="finish">${S.days[`${wn}|${dn}`]?T("finished")+" ✓":T("finish")}</button>
   </section></div>`;
}

/* ---------- PROGRESS ---------- */
function weeklyBest(match,fn){const out=[];for(let w=1;w<=WEEKS.length;w++){let b=0;
  WEEKS[w-1].days.forEach(d=>d.items.forEach((it,i)=>{if(!match(it))return;(it.sets||[]).forEach((s,si)=>{const v=S.logs[keyOf(w,d.day,i,si)];if(v?.done)b=Math.max(b,fn(v,s))})}));
  if(b)out.push([w,b])}return out}
function lineChart(pts,unit){
  if(pts.length<1)return `<p class="muted small">${T("noData")}</p>`;
  const W=320,H=140,L=34,R=12,Tp=14,B=24;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=1,x1=Math.max(8,Math.max(...xs)+1);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=Math.max(5,(y1-y0)*.25);y0=Math.floor((y0-pad)/5)*5;y1=Math.ceil((y1+pad)/5)*5;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>Tp+(1-(v-y0)/(y1-y0))*(H-Tp-B);
  const ticks=[y0,(y0+y1)/2,y1].map(v=>Math.round(v));
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const area=path+`L${X(pts[pts.length-1][0]).toFixed(1)},${Y(y0)}L${X(pts[0][0]).toFixed(1)},${Y(y0)}Z`;
  const lastP=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${t}</text>`).join("")}
   ${[1,Math.round(x1/2),x1].map(t=>`<text x="${X(t)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--faint)">W${t}</text>`).join("")}
   <path d="${area}" fill="var(--accent)" opacity=".14"/>
   <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
   <circle cx="${X(lastP[0])}" cy="${Y(lastP[1])}" r="5" fill="var(--accent)"/>
   <text x="${Math.min(X(lastP[0])+8,W-R-30)}" y="${Y(lastP[1])-8}" font-size="12" font-weight="700" fill="var(--fg)">${Math.round(lastP[1])}${unit}</text></svg>`;
}
function ladder(table,val,unitFmt){
  const col=(()=>{const bw=+S.profile.bw||160;if(S.profile.sex==="women"){return 1+(bw<115?0:bw<130?1:bw<145?2:bw<160?3:4)}return 6+(bw<145?0:bw<160?1:bw<175?2:bw<190?3:4)})();
  const max=table[table.length-1][col]*1.05;let lvl=null,next=null;
  for(const r of table){if(val>=r[col])lvl=r;else if(!next)next=r}
  return {html:`<div class="ladder">${table.map(r=>{const hit=val>=r[col],tg=next&&r[0]===next[0];
    return `<div class="rung ${hit?"hit":""} ${tg?"target":""}"><span class="lv">${r[0]}</span><span class="bar"><i style="width:${Math.min(100,val/r[col]*100)}%"></i></span><span class="v">${unitFmt(r[col])}</span></div>`}).join("")}</div>`,lvl,next,col}
}
function viewProgress(){
  const released=WEEKS.filter(w=>w.week<=CUR).reduce((a,w)=>a+w.days.length,0);
  let doneN=0;for(let w=1;w<=Math.min(CUR,WEEKS.length);w++)WEEKS[w-1].days.forEach(d=>{if(dayStatus(w,d.day)==="done")doneN++});
  let streak=0;for(let w=CUR;w>=1;w--){const ww=WEEKS[w-1];if(!ww)continue;const all=ww.days.filter(d=>!isCircuit(d)).every(d=>dayStatus(w,d.day)==="done");if(all)streak++;else if(w<CUR)break}
  const isBench=it=>/^bench press touch/i.test(it.name);
  const isPull=it=>/pull-?ups?$/i.test(it.name.trim())||/^pull-ups/i.test(it.name);
  const bench=weeklyBest(isBench,(v)=>e1rm(+v.wt,+v.reps));
  const pulls=weeklyBest(isPull,(v,s)=>s.load==="BW"?+v.reps:0);
  const bBest=bench.length?Math.max(...bench.map(p=>p[1])):0,pBest=pulls.length?Math.max(...pulls.map(p=>p[1])):0;
  const bl=ladder(BENCH.bench,bBest,v=>v+" lb"),pl=ladder(BENCH.pullups,pBest,v=>v);
  // best lifts
  const bests={};for(const [key,v] of Object.entries(S.logs)){if(!v.done||!+v.wt)continue;const [w,d,i,si]=key.split("|");const it=WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i];if(!it||/^BW/i.test(String(it.sets?.[si]?.load||"")))continue;const e=e1rm(+v.wt,+v.reps);const k=it.name.trim();if(!bests[k]||e>bests[k].e)bests[k]={e,wt:v.wt,reps:v.reps}}
  const top=Object.entries(bests).sort((a,b)=>b[1].e-a[1].e).slice(0,6);
  const sexLbl=S.profile.sex==="women"?T("women"):T("men");
  return brandBar()+`<div class="wrap">
   <section><div class="eyebrow">${esc(S.profile.name)} · ${sexLbl} · ${esc(S.profile.bw)} lb</div><h1>${T("progress")}</h1>
    <div class="stats"><div class="stat"><b>${doneN}<span style="font-size:18px;color:var(--faint)">/${released}</span></b><span>${T("compliance")}</span></div>
      <div class="stat"><b>${streak}</b><span>${T("streak")}</span></div>
      <div class="stat"><b>${bBest?r5(bBest):"—"}</b><span>${T("bench1rm")}</span></div></div></section>
   <section><div class="card chart"><div class="eyebrow">${T("bench1rm")} (lb)</div>${lineChart(bench," lb")}</div>
    <div class="card chart"><div class="eyebrow">${T("pullups")} (${T("reps")})</div>${lineChart(pulls,"")}</div></section>
   <section><h2>${T("benchmarks")}</h2><p class="muted small" style="margin:-4px 0 10px">${T("fromWorkouts")}</p>
    <div class="callout">Bench press 1RM: ${bl.lvl?`${T("yourLevel")} <b>${bl.lvl[0]}</b>`:"Below Entry"}${bl.next?` · <b>${bl.next[bl.col]-r5(bBest)} lb</b> ${T("toNext")} ${bl.next[0]}`:""}</div>${bl.html}
    <div class="callout">Pull-ups: ${pl.lvl?`${T("yourLevel")} <b>${pl.lvl[0]}</b>`:"Below Entry"}${pl.next?` · <b>${Math.max(0,Math.ceil(pl.next[pl.col]-pBest))} ${T("reps")}</b> ${T("toNext")} ${pl.next[0]}`:""}</div>${pl.html}
   </section>
   <section><h2>${T("records")}</h2><div class="card" style="padding:4px 14px"><div class="prs">${top.length?top.map(([n,b])=>`<div class="pr"><span>${esc(n)}</span><span class="num muted">${b.wt}×${b.reps} · <b>${r5(b.e)}</b></span></div>`).join(""):`<p class="muted small">${T("noData")}</p>`}</div></div></section>
  </div>`;
}

let restT=null,restEnd=0;
function startRest(secs){
  if(S.profile.restOff)secs=0;
  const el=document.getElementById("rest"),box=document.getElementById("restbox");
  clearInterval(restT);if(!secs){el.hidden=true;return}
  restEnd=Date.now()+secs*1000;el.hidden=false;
  const tick=()=>{const left=Math.round((restEnd-Date.now())/1000);const over=left<=0;
    box.className="restbox"+(over?" over":"");
    const a=Math.abs(left);box.innerHTML=`<span class="clock">${over?"+":""}${Math.floor(a/60)}:${String(a%60).padStart(2,"0")}</span><span class="lbl">${over?T("restOver"):T("rest")}</span><button data-add>+15s</button><button data-skip>${T("skip")}</button>`;
    if(left===0&&navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}
    if(left<-90)stopRest()};
  tick();restT=setInterval(tick,500);
}
function stopRest(){clearInterval(restT);document.getElementById("rest").hidden=true}
document.getElementById("restbox").addEventListener("click",e=>{if(e.target.closest("[data-add]"))restEnd+=15000;if(e.target.closest("[data-skip]"))stopRest()});

function toast(msg,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}

/* ---------- finish summary ---------- */
/* ---------- workout timer ----------
   Starts at the first ticked set, stops at "Finish workout". If nobody taps Finish, the session
   closes after an hour with no new set, and its time ends at the last ticked set. The duration is
   written to the athlete's sheet, column P of that day's "Day N" row. */
const WT_IDLE=60*60*1000;
function wtGet(w,d){S.timers=S.timers||{};const k=`${w}|${d}`,t=S.timers[k];
  if(t&&!t.end&&Date.now()-t.last>WT_IDLE){t.end=t.last;save();queueDuration(w,d)}return t}
function wtTouch(w,d){S.timers=S.timers||{};const t=wtGet(w,d),now=Date.now();
  if(!t){S.timers[`${w}|${d}`]={start:now,last:now};save();updateTimer();return}
  if(!t.end){t.last=now;save()}}
function wtFinish(w,d){const t=wtGet(w,d);if(t&&!t.end){t.end=Date.now();t.fin=true;save();queueDuration(w,d)}return t}
function wtMins(t){return t?Math.max(1,Math.round(((t.end||Date.now())-t.start)/60000)):0}
function fmtClock(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function timerHtml(w,d){const t=wtGet(w,d);
  if(!t)return `<div class="wtimer" id="wtimer">⏱ ${T("wtWait")}</div>`;
  if(t.end)return `<div class="wtimer" id="wtimer">⏱ ${wtMins(t)} min</div>`;
  return `<div class="wtimer run" id="wtimer" data-start="${t.start}">⏱ ${fmtClock(Date.now()-t.start)}</div>`}
function updateTimer(){const el=document.getElementById("wtimer");if(!el||VIEW.name!=="workout")return;el.outerHTML=timerHtml(VIEW.w,VIEW.d)}
setInterval(()=>{const el=document.getElementById("wtimer");if(el&&el.dataset.start)updateTimer()},1000);
/* The embedded circuit timer sends its explanation of the workout; show it above the timer (and remember it). */
window.addEventListener("message",e=>{const m=e.data;if(!m||!m.dbspeedTimer||typeof m.desc!=="string")return;
  S.circDesc=S.circDesc||{};if(m.url)S.circDesc[m.url]=m.desc.slice(0,800);save();
  const el=document.getElementById("circDesc");if(el){el.textContent=m.desc;el.hidden=false}});
/* Finished workouts are marked in the athlete's sheet (column P of the "Day N" row): "⏱ 58 min" or "✓ Done".
   The app reads these back, so sessions done and the week streak survive a new phone. */
function dayRowOf(day){if(day.row)return day.row;const rows=day.items.map(it=>it.row).filter(Boolean);return rows.length?Math.min(...rows)-2:0}
function queueDayMark(w,d,value){
  if(!LIVE)return;const W=WEEKS[w-1];const day=W&&W.days.find(x=>x.day===d);if(!day||!W.tab)return;
  const dayRow=dayRowOf(day);if(dayRow<1)return;
  S.queue[`${W.tab}|${dayRow}|16`]={tab:W.tab,row:dayRow,col:16,value,v:Date.now()};save();scheduleFlush();
}
function queueDuration(w,d){queueDayMark(w,d,`⏱ ${wtMins(S.timers[`${w}|${d}`])} min`)}
function finishWorkout(wn,dn){
  const tm=wtFinish(wn,dn);if(!tm)queueDayMark(wn,dn,"✓ Done");
  const d=WEEKS[wn-1].days.find(x=>x.day===dn);let sets=0,vol=0,prs=[];
  d.items.forEach((it,i)=>{const before=best1rm(it.name,wn);let best=0;(it.sets||[]).forEach((_,s)=>{const v=S.logs[keyOf(wn,dn,i,s)];if(v?.done){sets++;vol+=(+v.wt||0)*(+v.reps||0);best=Math.max(best,e1rmRpe(+v.wt,+v.reps,it.rpe))}});
    if(best&&before&&best>before+0.5)prs.push(it.name)});
  S.days[`${wn}|${dn}`]=Date.now();save();stopRest();
  document.getElementById("overlay").innerHTML=`<div class="scrim" data-close></div><div class="sheet"><div class="inner wrap"><div class="done-panel">
    <div class="eyebrow">${T("week")} ${WN(wn)} · ${esc(dayTitle(d))}</div><div class="big">${T("finished")}</div>
    <div class="done-grid"><div class="stat"><b class="num">${tm?wtMins(tm):"–"}</b><span>${T("duration")} (min)</span></div><div class="stat"><b class="num">${sets}</b><span>${T("setsDone")}</span></div><div class="stat"><b class="num">${vol>=1000?(vol/1000).toFixed(1)+"k":vol}</b><span>${T("volume")} (lb)</span></div><div class="stat"><b class="num">${prs.length}</b><span>${T("prs")}</span></div></div>
    ${prs.length?`<div class="callout">🏅 ${prs.map(esc).join(", ")}</div>`:""}
    <button class="btn block" data-close>${T("back")}</button></div></div></div>`;
}

/* Heaviest weight this athlete has logged on this exercise (other sets), for the typo check. */
function usualWeight(key){const [w0,d0,i0]=key.split("|");const it0=WEEKS[w0-1]?.days.find(x=>x.day===d0)?.items[i0];if(!it0)return 0;const k=exKey(it0.name);let m=0;
  for(const [kk,v] of Object.entries(S.logs)){if(kk===key||!v.done||!+v.wt)continue;const [w,d,i]=kk.split("|");const it=WEEKS[w-1]?.days.find(x=>x.day===d)?.items[i];if(it&&exKey(it.name)===k)m=Math.max(m,+v.wt)}
  return m}
function toggleSet(row,forceDone){
  const k=row.dataset.k;const v=S.logs[k]||{};
  const wt=row.querySelector('[data-f="wt"]'),rp=row.querySelector('[data-f="reps"]');
  if(forceDone||!v.done){if(v.done)return;
    const cand=+(wt.value||(wt.placeholder&&/^\d/.test(wt.placeholder)?wt.placeholder:0));
    if(cand>0&&row.dataset.ok!==String(cand)){const ref=usualWeight(k);
      if(cand>=700||(ref>0&&cand>ref*1.6&&cand-ref>=40)){row.dataset.ok=String(cand);wt.classList.add("warn");
        toast(S.profile.lang==="fr"?`${cand} lb ? C'est bien plus que d'habitude${ref?` (${ref})`:""}. Corrige ou touche ✓ pour confirmer.`:`${cand} lb? That's way more than usual${ref?` (${ref})`:""}. Fix it, or tap ✓ to confirm.`,4500);return}}
    wt.classList.remove("warn");
    v.wt=wt.value||(wt.placeholder&&/^\d/.test(wt.placeholder)?wt.placeholder:"");v.reps=rp.value||(/^\d/.test(rp.placeholder)?(rp.placeholder.match(/(\d+)\D*$/)||[])[1]||"":"");wt.value=v.wt;rp.value=v.reps;v.done=true;startRest(+row.dataset.rest);{const [w0,d0]=k.split("|");wtTouch(+w0,d0)}}
  else v.done=false;
  S.logs[k]=v;keepDraft(k);save();row.classList.toggle("done",v.done);updateCount();queueSet(k);
}
// Typing the reps (and leaving the box) completes the set and starts the rest timer.
app.addEventListener("change",e=>{
  if(e.target.dataset.f!=="reps"||!e.target.value)return;

function updateCount(){if(VIEW.name!=="workout")return;const d=WEEKS[VIEW.w-1].days.find(x=>x.day===VIEW.d);let total=0,done=0;
  d.items.forEach((it,i)=>(it.sets||[]).forEach((_,s)=>{total++;if(S.logs[keyOf(VIEW.w,VIEW.d,i,s)]?.done)done++}));
  const c=document.getElementById("setCount");if(c)c.textContent=`${done} ${T("ofSets")} ${total} ${T("sets")}`;const b=document.getElementById("pbar");if(b)b.style.width=(total?done/total*100:0)+"%"}
document.getElementById("overlay").addEventListener("click",e=>{
  const t=e.target;const p=S.profile;
  if(t.closest("#a2hsGot")){S.a2hsHide=true;save();closeSettings();return}   // they've seen the steps: stop showing the banner on this phone
  if(t.closest("[data-close]")){closeSettings();return}

  if(t.closest("#coachSw")){p.coach=!p.coach;save();openSettings();return}
  if(t.closest("#restSw")){p.restOff=!p.restOff;if(p.restOff)stopRest();save();openSettings();return}
  if(t.closest("#clearSample2")){S.logs={};S.notes={};S.days={};S.sample=false;save();toast("Sample cleared");openSettings();return}
});
document.getElementById("overlay").addEventListener("input",e=>{
  if(e.target.id==="pName"){S.profile.name=e.target.value;save()}
  if(e.target.id==="pBw"){S.profile.bw=e.target.value;save();queueProfile()}
});


/* ---------- season (periodization) ---------- */
let SEASON=null;
const MONTH_IX=m=>MONTHS.findIndex(x=>x.toLowerCase().startsWith(String(m).toLowerCase().slice(0,3)));
function seasonYear(mi){return mi>=7?2026:2027}
function parsePeriod(raw){
  if(!raw||!raw.length)return null;
  const byN={};const events=[];
  // dated events list at the top: a name followed within a few cells by "Month D, YYYY"
  raw.slice(0,8).forEach(r=>{for(let c=0;c<r.length;c++){const name=String(r[c]||"").trim();if(!name||/\d{4}$/.test(name))continue;
    for(let k=c+1;k<=c+6&&k<r.length;k++){const m=String(r[k]||"").match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
      if(m){const mi=MONTH_IX(m[1]);if(mi>=0)events.push([`${m[3]}-${String(mi+1).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`,name.replace(/\s+$/,"")]);break}}}});
  let week1=null;
  for(let i=0;i<raw.length;i++){
    const r=raw[i];if(String(r[0]).trim().toUpperCase()!=="WEEK")continue;
    const monthRow=raw[i-1]||[],startRow=raw[i+1]||[];
    let curMonth="";const fill={};
    for(let c=1;c<r.length;c++){if(monthRow[c])curMonth=monthRow[c];
      const n=parseInt(r[c],10);if(!n)continue;
      if(!week1&&n===1){const m=String(startRow[c]).match(/-(\d+)/);const mi=MONTH_IX(curMonth);if(m&&mi>=0)week1=new Date(seasonYear(mi),mi,+m[1])}
      byN[n]=byN[n]||{n};
      for(let j=i+3;j<Math.min(raw.length,i+9);j++){const lab=String(raw[j][0]||"").trim().toLowerCase();if(!lab)continue;if(lab==="periodization")break;
        const v=String(raw[j][c]||"").trim();
        if(lab==="gym focus"||lab==="season"){if(v)fill[lab]=v;if(fill[lab])byN[n][lab==="gym focus"?"focus":"season"]=fill[lab]}
        else if(lab==="tests"&&v)byN[n].test=v;
        else if(lab.startsWith("important")&&v)byN[n].event=v.replace(/\n/g," · ");}
    }
  }
  if(!week1)return null;
  const weeks=Object.values(byN).sort((a,b)=>a.n-b.n).map(w=>({...w,start:new Date(week1.getFullYear(),week1.getMonth(),week1.getDate()+(w.n-1)*7)}));
  // Winter program only: drop on-season and off-season weeks (maintenance etc.)
  const winter=weeks.filter(w=>!/on-season|off-season/i.test(w.season||""));
  const kept=winter.length?winter:weeks;
  const first=kept[0].start,last=new Date(kept[kept.length-1].start.getFullYear(),kept[kept.length-1].start.getMonth(),kept[kept.length-1].start.getDate()+6);
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  events.sort((a,b)=>a[0]<b[0]?-1:1);
  return {weeks:kept,events:events.filter(([d])=>d>=iso(first)&&d<=iso(last))};
}
function teamSeason(){return{weeks:WEEKS.map(w=>({n:w.week,start:weekDate(w),focus:phaseOf(w),season:"Winter Season"})),events:EVENTS}}
function seasonWeekAt(d){if(!SEASON||isNaN(d))return null;let hit=null;for(const w of SEASON.weeks){if(w.start<=d)hit=w}return hit}
function viewSeason(){
  const S0=SEASON||teamSeason();if(!S0||!S0.weeks.length)return brandBar()+`<div class="wrap"><section><h1>${T("seasonTab")}</h1><p class="muted">No season plan yet.</p></section></div>`;
  const now=(()=>{let h=null;for(const w of S0.weeks)if(w.start<=TODAY)h=w;return h})();
  const runs=[];S0.weeks.forEach(w=>{const f=w.focus||"—";const last=runs[runs.length-1];if(last&&last.focus===f&&last.to===w.n-1){last.to=w.n;last.end=w.start}else runs.push({focus:f,from:w.n,to:w.n,start:w.start,end:w.start})});
  const total=S0.weeks.length;
  const strip=runs.map(r=>`<i style="flex:${r.to-r.from+1};background:${phaseColor(r.focus)}" title="${esc(r.focus)}"></i>`).join("");
  const pos=now?Math.max(0,S0.weeks.indexOf(now))/total*100:-1;
  const end=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
  const dates=S0.events.map(([d,n])=>[new Date(d+"T00:00"),n]);
  return brandBar()+`<div class="wrap">
   <section><div class="eyebrow">${T("seasonIntro")}</div><h1>${T("seasonTab")}</h1>
    <div style="position:relative;padding-top:6px"><div style="display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden">${strip}</div>
     ${pos>=0?`<div style="position:absolute;top:0;bottom:-6px;left:calc(${pos}% );width:2px;background:var(--fg)"></div>`:""}</div>
    ${now?`<div class="next">${I.chev}<span>${T("week")} <b>${now.n}</b>${now.focus?` · <b>${esc(now.focus)}</b>`:""}${now.season?` · ${esc(now.season)}`:""}</span></div>`:""}
   </section>
   <section><h2>${T("blocks")}</h2>
    <div class="card" style="padding:4px 14px">${runs.filter(r=>r.focus!=="—").map(r=>{const cur=now&&now.n>=r.from&&now.n<=r.to,past=now&&now.n>r.to;
      return `<div class="ev ${past?"past":""}" style="grid-template-columns:12px 1fr auto;align-items:center"><span class="dot" style="background:${phaseColor(r.focus)}"></span>
        <span><b>${esc(r.focus)}</b><br><span class="muted small">${T("weeksWord")} ${r.from}${r.to>r.from?"–"+r.to:""} · ${fmtDate(r.start)} – ${fmtDate(end(r.end))}</span></span>
        ${cur?`<span class="state part">${T("now")}</span>`:""}</div>`}).join("")}</div></section>
   <section><h2>${T("dates")}</h2>
    <div class="card" style="padding:4px 14px">${dates.length?dates.map(([dt,n])=>{const days=Math.round((dt-TODAY)/864e5);
      return `<div class="ev ${days<0?"past":""}"><span class="dt">${fmtDate(dt)}</span><span>${esc(n)}${days>=0&&days<=60?` <span class="muted small">· ${T("inDays")(days)}</span>`:""}</span></div>`}).join(""):`<p class="muted small">—</p>`}</div></section>
  </div>`;
}

/* ---------- live mode: read from and write to the athlete's own Google Sheet ---------- */
/* From the week of Oct 26, 2026 on, a set only counts as logged when it is in brackets, "125 (125x3)",
   which is how the app writes it. A plain "125" or "35x8" is the coach's prescription.
   Earlier weeks keep the old reading, so sets athletes typed straight into the sheet still count. */
const STRICT_FROM=new Date(2026,9,26);
function parseLogged(load,repsCell,strict){
  load=String(load||"").trim();
  let m=load.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  if(m){const inner=m[2].trim();
    const bw=m[1].trim().match(/^BW\s*\+\s*(\d+(?:\.\d+)?)$/i);if(bw&&/^\d+$/.test(inner))return{presc:"BW",logged:{wt:bw[1],reps:inner,done:true}};
    let k=inner.match(/^(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)$/i);
    if(k)return{presc:m[1].trim(),logged:{wt:k[1],reps:k[2],done:true}};
    k=inner.match(/^(\d+)$/);if(k)return{presc:m[1].trim(),logged:{wt:"",reps:k[1],done:true}};
    return{presc:load,logged:null}}
  if(strict)return{presc:load,logged:null};
  m=load.match(/^(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)$/i);if(m)return{presc:"",logged:{wt:m[1],reps:m[2],done:true}};
  // a plain number the athlete typed over the prescription, maybe with a comment ("110 💀")
  m=load.match(/^(\d+(?:\.\d+)?)\s*(?:lbs?|kg)?(?:\s+(.*))?$/i);if(m&&!/[%~]/.test(load))return{presc:"",logged:{wt:m[1],reps:repsPlaceholder(repsCell),done:true}};
  return{presc:load,logged:null};
}
function cellValue(set,v){
  const p=set.load||"";if(!v||!v.done)return p;
  const wt=String(v.wt||"").trim().replace(/^\+/,""),reps=String(v.reps||"").trim();
  // Bodyweight exercises: a number in the weight box is ADDED weight → "BW+25 (8)". No number → "BW (8)".
  if(/^BW$/i.test(p.trim()))return +wt?`BW+${wt} (${reps})`:`BW (${reps})`;
  const inner=wt&&reps?`${wt}x${reps}`:(wt||reps);
  if(!p)return `(${inner})`;
  return `${p} (${inner})`;
}
function findKey(tab,row,col){
  const w=WEEKS.find(x=>x.tab===tab);if(!w)return null;
  for(const d of w.days){const i=d.items.findIndex(it=>it.row===row);if(i<0)continue;
    if(col===16)return{note:`${w.week}|${d.day}|${i}`};
    const s=d.items[i].sets.findIndex(x=>x.col===col);if(s>=0)return{set:keyOf(w.week,d.day,i,s)}}
  return null;
}
function applyLive(data){
  applyBrand(data.athlete.team);
  TEAM.name=data.athlete.name;EVENTS=[];SEASON=parsePeriod(data.period);if(SEASON)EVENTS=SEASON.events;
  WEEKS=data.weeks.filter(w=>w.days.length&&parseFloat(w.name)>=1).map((w,wi)=>({week:wi+1,name:w.name,label:w.label,date:w.date,tab:w.tab,
    days:w.days.map(d=>({day:d.day,row:d.row||0,mark:d.mark||"",summary:d.summary,circuit:!!d.circuit,timer:d.timer||null,items:d.items.map(it=>({...it,
      sets:(it.sets||[]).map(s=>{const p=parseLogged(s.load,s.reps,weekDate(w)>=STRICT_FROM);return{load:p.presc,reps:s.reps,col:s.col,_logged:p.logged}})}))}))}));
  S.logs={};S.notes={};
  WEEKS.forEach(w=>w.days.forEach(d=>d.items.forEach((it,i)=>{
    if(it.note)S.notes[`${w.week}|${d.day}|${i}`]=it.note;
    it.sets.forEach((s,si)=>{if(s._logged)S.logs[keyOf(w.week,d.day,i,si)]=s._logged})})));
  for(const q of Object.values(S.queue||{})){const f=findKey(q.tab,q.row,q.col);if(!f)continue;
    if(f.set&&q.log)S.logs[f.set]=q.log;if(f.note!=null&&q.note!=null)S.notes[f.note]=q.note}
  S.timers=S.timers||{};WEEKS.forEach(w=>w.days.forEach(d=>{const k=`${w.week}|${d.day}`,m=String(d.mark||"");
    if(/⏱|✓|done/i.test(m))S.days[k]=S.days[k]||1;
    const mm=m.match(/(\d+)\s*min/);if(mm&&!(S.timers[k]&&S.timers[k].start))S.timers[k]={start:1,end:1+ +mm[1]*60000,last:1,fin:true}}));
  S.drafts=S.drafts||{};for(const [ck,dv] of Object.entries(S.drafts)){const [tab,row,col]=ck.split("|");const f=findKey(tab,+row,+col);
    if(!f||!f.set){delete S.drafts[ck];continue}if(S.logs[f.set]?.done){delete S.drafts[ck];continue}S.logs[f.set]={wt:dv.wt,reps:dv.reps,done:false}}
  if(!S.profile.name||S.profile.name==="Alex")S.profile.name=data.athlete.name;
  if(!S.queue.profile){if(data.athlete.sex==="men"||data.athlete.sex==="women")S.profile.sex=data.athlete.sex;if(+data.athlete.bw)S.profile.bw=String(data.athlete.bw)}
  CUR=currentWeekNum();save();
}
function queueSet(k){
  if(!LIVE)return;const [w,d,i,s]=k.split("|");const W=WEEKS[w-1];const it=W.days.find(x=>x.day===d).items[i];const set=it.sets[s];
  const log=S.logs[k]||{};S.queue[`${W.tab}|${it.row}|${set.col}`]={tab:W.tab,row:it.row,col:set.col,value:cellValue(set,log),log,v:Date.now()};
  save();scheduleFlush();
}
function queueNote(n){
  if(!LIVE)return;const [w,d,i]=n.split("|");const W=WEEKS[w-1];const it=W.days.find(x=>x.day===d).items[i];
  S.queue[`${W.tab}|${it.row}|16`]={tab:W.tab,row:it.row,col:16,value:S.notes[n]||"",note:S.notes[n]||"",v:Date.now()};
  save();scheduleFlush(2000);
}
/* Sex and bodyweight are kept in the admin sheet (latest value only) so they survive a new phone or cleared browser. */
function queueProfile(){if(!LIVE)return;const bw=parseFloat(String(S.profile.bw||"").replace(",","."));
  S.queue.profile={profile:{sex:S.profile.sex||"",bw:bw>=60&&bw<=500?bw:""},v:Date.now()};save();scheduleFlush(2000)}
let flushT=null,flushing=false;
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(flushQueue,ms||900);setSync("saving")}
async function flushQueue(){
  if(!LIVE||flushing)return;const entries=Object.entries(S.queue||{});if(!entries.length){setSync("saved");return}
  flushing=true;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({t:TOKEN,d:DEVICE,profile:(entries.find(([k])=>k==="profile")||[])[1]?.profile,writes:entries.filter(([k,q])=>k!=="profile"&&q.tab).map(([,q])=>({tab:q.tab,row:q.row,col:q.col,value:q.value}))})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"save failed");
    for(const [k,q] of entries){if(S.queue[k]&&S.queue[k].v===q.v)delete S.queue[k]}
    save();setSync(Object.keys(S.queue).length?"saving":"saved");
    if(Object.keys(S.queue).length)scheduleFlush();
  }catch(e){setSync("offline");clearTimeout(flushT);flushT=setTimeout(flushQueue,15000)}
  finally{flushing=false}
}
function setSync(st){const el=document.getElementById("sync");if(!el)return;el.dataset.s=st;
  el.textContent=st==="saving"?"Saving…":st==="offline"?"Offline, will sync":"Saved to your sheet ✓"}
window.addEventListener("online",()=>flushQueue());
async function boot(){
  if(!LIVE){render();return}
  app.innerHTML=`<div class="loader">${BRAND?`<img class="teamlogo" src="${BRAND.logo}" alt="">`:""}<div class="ring" aria-hidden="true"><i></i></div><div class="eyebrow">Loading your program…</div></div>`;
  const CK=KEY+"-cache";
  try{
    const r=await fetch(API_URL+"?t="+encodeURIComponent(TOKEN)+"&d="+encodeURIComponent(DEVICE));const data=await r.json();
    if(data.locked){try{localStorage.removeItem(CK)}catch(_){}
      app.innerHTML=`<div class="wrap" style="padding-block:30vh 0;display:grid;gap:12px;text-align:center"><h2>This link is already in use</h2><p class="muted">${esc(data.error)}</p></div>`;return}
    if(data.error&&/not active/i.test(data.error)){try{localStorage.removeItem(CK)}catch(_){}
      app.innerHTML=`<div class="wrap" style="padding-block:30vh 0;display:grid;gap:12px;text-align:center"><h2>This link is no longer active</h2><p class="muted">Contact your coach to get access to your program.</p></div>`;return}
    if(data.error)throw new Error(data.error);
    try{localStorage.setItem(CK,JSON.stringify(data))}catch(e){}
    applyLive(data);
  }catch(e){
    let cached=null;try{cached=JSON.parse(localStorage.getItem(CK)||"null")}catch(_){}
    if(!cached){app.innerHTML=`<div class="wrap" style="padding-block:30vh 0;display:grid;gap:12px;text-align:center"><h2>Can't load your program</h2><p class="muted">${esc(e.message||"Check your connection and try again.")}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;return}
    applyLive(cached);toast("Offline: showing your last saved program");
  }
  if(!WEEKS.length){
    const nm=esc((S.profile&&S.profile.name)||"");
    app.innerHTML=`<div class="wrap" style="padding-block:28vh 0;display:grid;gap:12px;text-align:center"><div class="eyebrow">You're all set${nm?", "+nm:""}</div><h2>Your program starts Monday</h2><p class="muted">Week 1 appears here on the first Monday of your program. Add this page to your home screen so it's one tap away.</p><p class="muted small">Votre programme commence lundi. La semaine 1 apparaîtra ici.</p></div>`;
    return}
  render();flushQueue();
}
boot();
</script>
