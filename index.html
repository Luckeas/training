/* ---------- season (periodization) ---------- */
let SEASON=null;
const MONTH_IX=m=>MONTHS.findIndex(x=>x.toLowerCase().startsWith(String(m).toLowerCase().slice(0,3)));
function seasonYear(mi){return mi>=7?2026:2027}
function parsePeriod(raw){
  if(!raw||!raw.length)return null;
  const byN={};const events=[];
  // dated events list at the top: a name followed within a few cells by "Month D, YYYY"
  raw.slice(0,8).forEach(r=>{for(let c=0;c<r.length;c++){const name=String(r[c]||"").trim();if(!name||/\d{4}$/.test(name))continue;
    for(let k=c+1;k<=c+6&&k<r.length;k++){const m=String(r[k]||"").match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
      if(m){const mi=MONTH_IX(m[1]);if(mi>=0)events.push([`${m[3]}-${String(mi+1).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`,name.replace(/\s+$/,"")]);break}}}});
  let week1=null;
  for(let i=0;i<raw.length;i++){
    const r=raw[i];if(String(r[0]).trim().toUpperCase()!=="WEEK")continue;
    const monthRow=raw[i-1]||[],startRow=raw[i+1]||[];
    let curMonth="";const fill={};
    for(let c=1;c<r.length;c++){if(monthRow[c])curMonth=monthRow[c];
      const n=parseInt(r[c],10);if(!n)continue;
      if(!week1&&n===1){const m=String(startRow[c]).match(/-(\d+)/);const mi=MONTH_IX(curMonth);if(m&&mi>=0)week1=new Date(seasonYear(mi),mi,+m[1])}
      byN[n]=byN[n]||{n};
      for(let j=i+3;j<Math.min(raw.length,i+9);j++){const lab=String(raw[j][0]||"").trim().toLowerCase();if(!lab)continue;if(lab==="periodization")break;
        const v=String(raw[j][c]||"").trim();
        if(lab==="gym focus"||lab==="season"){if(v)fill[lab]=v;if(fill[lab])byN[n][lab==="gym focus"?"focus":"season"]=fill[lab]}
        else if(lab==="tests"&&v)byN[n].test=v;
        else if(lab.startsWith("important")&&v)byN[n].event=v.replace(/\n/g," · ");}
    }
  }
  if(!week1)return null;
  const weeks=Object.values(byN).sort((a,b)=>a.n-b.n).map(w=>({...w,start:new Date(week1.getFullYear(),week1.getMonth(),week1.getDate()+(w.n-1)*7)}));
  // Winter program only: drop on-season and off-season weeks (maintenance etc.)
  const winter=weeks.filter(w=>!/on-season|off-season/i.test(w.season||""));
  const kept=winter.length?winter:weeks;
  const first=kept[0].start,last=new Date(kept[kept.length-1].start.getFullYear(),kept[kept.length-1].start.getMonth(),kept[kept.length-1].start.getDate()+6);
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  events.sort((a,b)=>a[0]<b[0]?-1:1);
  return {weeks:kept,events:events.filter(([d])=>d>=iso(first)&&d<=iso(last))};
}
function teamSeason(){return{weeks:WEEKS.map(w=>({n:w.week,start:weekDate(w),focus:phaseOf(w),season:"Winter Season"})),events:EVENTS}}
function seasonWeekAt(d){if(!SEASON||isNaN(d))return null;let hit=null;for(const w of SEASON.weeks){if(w.start<=d)hit=w}return hit}
function viewSeason(){
  const S0=SEASON||teamSeason();if(!S0||!S0.weeks.length)return brandBar()+`<div class="wrap"><section><h1>${T("seasonTab")}</h1><p class="muted">No season plan yet.</p></section></div>`;
  const now=(()=>{let h=null;for(const w of S0.weeks)if(w.start<=TODAY)h=w;return h})();
  const runs=[];S0.weeks.forEach(w=>{const f=w.focus||"—";const last=runs[runs.length-1];if(last&&last.focus===f&&last.to===w.n-1){last.to=w.n;last.end=w.start}else runs.push({focus:f,from:w.n,to:w.n,start:w.start,end:w.start})});
  const total=SEASON?Math.max(S0.weeks.length,totalWeeks()):S0.weeks.length,rest=total-S0.weeks.length;
  const strip=runs.map(r=>`<i style="flex:${r.to-r.from+1};background:${phaseColor(r.focus)}" title="${esc(r.focus)}"></i>`).join("")+(rest>0?`<i style="flex:${rest};background:var(--line)" title="${T("nextSeason")}"></i>`:"");
  const lastW=S0.weeks[S0.weeks.length-1],nsFrom=lastW?new Date(lastW.start.getFullYear(),lastW.start.getMonth(),lastW.start.getDate()+7):null;
  const pos=now?Math.max(0,S0.weeks.indexOf(now))/total*100:-1;
  const end=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
  const dates=S0.events.map(([d,n])=>[new Date(d+"T00:00"),n]);
  return brandBar()+`<div class="wrap">
   <section><div class="eyebrow">${T("seasonIntro")}</div><h1>${T("seasonTab")}</h1>

function cellValue(set,v){

    toast("Offline: showing your last saved program");flushQueue();return}
  if(!shown){
    try{applyLive(data)}catch(e){REFRESHING=false;app.innerHTML=cantLoad(e.message);return}
    saveCache(data);REFRESHING=false;READY=true;if(showProgram())flushQueue();return}
  swapIn(data,"Offline: showing your last saved program");
}
boot();
/* Coming back to the app (a home-screen app left open since Sunday, say) after more than 5 minutes away:
   fetch the latest program the same quiet way, so nobody has to close and reopen the app for a new week.
   A save that's already on its way finishes first, so the program fetched includes it. */
const RETURN_REFRESH_MS=5*60*1000;
async function refreshOnReturn(){
  if(!LIVE||!READY||BLOCKED||REFRESHING||document.visibilityState!=="visible"||Date.now()-lastFetch<RETURN_REFRESH_MS)return;
  REFRESHING=true;
  for(let i=0;flushing&&i<150;i++)await new Promise(r=>setTimeout(r,200));
  if(flushing){REFRESHING=false;lastFetch=0;return}   // a save is still on its way after 30 s: try again next time
  const data=await fetchProgram();
  if(blocked(data))return;
  if(!usable(data)){   // offline: keep the program on screen, move to today's week if the day changed, retry in a minute
    lastFetch=Date.now()-RETURN_REFRESH_MS+60000;
    whenIdle(()=>{const d=todayDate();
      if(d.getTime()!==TODAY.getTime()&&CACHE){try{applyFresh(CACHE)}catch(_){}}
      REFRESHING=false;flushQueue()});
    return}
  swapIn(data,"");
}
document.addEventListener("visibilitychange",refreshOnReturn);
window.addEventListener("pageshow",e=>{if(e.persisted)refreshOnReturn()});

/* Self-update: iPhone home-screen apps keep an old copy of the page in memory and have no refresh
   button. When the app opens or comes back to the front, compare this page's code with the live
   one and reload with a fresh URL if it changed (at most once a minute, never in a loop). */
const APP_CODE=(document.currentScript&&document.currentScript.textContent)||"";
async function checkForUpdate(){
  try{
    if(!APP_CODE||!navigator.onLine)return;
    const last=+(sessionStorage.getItem("dbs-upd")||0);if(Date.now()-last<60000)return;
    const html=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"");
    const m=html.match(/<script>([\s\S]*)<\/script>/);if(!m)return;
    if(m[1].trim()===APP_CODE.trim())return;
    sessionStorage.setItem("dbs-upd",String(Date.now()));
    const u=new URL(location.href);u.searchParams.set("r",String(Date.now()));location.replace(u.toString());
  }catch(_){}
}
setTimeout(checkForUpdate,3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkForUpdate()});
</script>
